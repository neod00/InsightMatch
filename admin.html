<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - InsightMatch</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Side Panel Styles */
        .side-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .side-panel-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-panel {
            position: fixed;
            top: 0;
            right: -600px;
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: rgba(23, 23, 23, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2001;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .side-panel.active {
            right: 0;
        }

        .side-panel-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .close-panel-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0;
        }

        .close-panel-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
            transform: rotate(90deg);
        }

        .side-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .side-panel-footer {
            padding: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            background: rgba(20, 20, 20, 0.5);
        }

        .info-group {
            margin-bottom: 24px;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .info-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        .consultant-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }

        .consultant-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <div class="logo-icon" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">
                    <i data-lucide="shield" style="width: 20px; height: 20px;"></i>
                </div>
                <div class="logo-text">
                    <span>InsightMatch</span>
                    <span style="color: var(--warning);">Admin Panel</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="index.html">
                    <i data-lucide="home" style="width: 16px; height: 16px;"></i>
                    메인 사이트
                </a>
            </div>

            <div class="nav-actions">
                <span style="display: flex; align-items: center; gap: 8px; color: var(--warning);">
                    <i data-lucide="crown" style="width: 18px; height: 18px;"></i>
                    관리자
                </span>
            </div>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobile-nav">
        <span style="display: flex; align-items: center; gap: 8px; color: var(--warning); justify-content: center;">
            <i data-lucide="crown" style="width: 18px; height: 18px;"></i>
            관리자
        </span>
        <div class="nav-divider"></div>
        <a href="index.html" onclick="closeMobileMenu()">
            <i data-lucide="home"
                style="width: 16px; height: 16px; display: inline; vertical-align: middle; margin-right: 8px;"></i>
            메인 사이트
        </a>
    </div>

    <!-- Admin Container -->
    <div class="container admin-container">
        <div class="fade-in-up"
            style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1 style="font-size: 2rem; margin-bottom: 8px;">관리자 대시보드</h1>
                <p style="color: var(--text-muted);">업체의 컨설팅 매칭 요청과 컨설턴트를 관리하세요.</p>
            </div>
            <button class="btn btn-secondary" onclick="refreshData()"
                style="display: flex; align-items: center; gap: 8px;">
                <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i>
                새로고침
            </button>
        </div>

        <!-- Admin Tabs -->
        <div class="admin-tabs fade-in-up">
            <button class="admin-tab active" onclick="switchTab('analysis')">
                <i data-lucide="handshake" style="width: 18px; height: 18px;"></i>
                매칭 요청
                <span class="badge-count" id="analysis-count">-</span>
            </button>
            <button class="admin-tab" onclick="switchTab('consultants')">
                <i data-lucide="users" style="width: 18px; height: 18px;"></i>
                컨설턴트 승인
                <span class="badge-count" id="consultant-count">-</span>
            </button>
        </div>

        <!-- Stats Cards -->
        <div class="features-grid fade-in-up" style="margin-bottom: 40px;" id="stats-cards">
            <div class="feature-card" style="text-align: center;">
                <div id="stat-total" style="font-size: 2.5rem; font-weight: 800; color: var(--primary);">-</div>
                <p style="color: var(--text-muted);">전체 요청</p>
            </div>
            <div class="feature-card" style="text-align: center;">
                <div id="stat-pending" style="font-size: 2.5rem; font-weight: 800; color: var(--warning);">-</div>
                <p style="color: var(--text-muted);">대기 중</p>
            </div>
            <div class="feature-card" style="text-align: center;">
                <div id="stat-completed" style="font-size: 2.5rem; font-weight: 800; color: var(--success);">-</div>
                <p style="color: var(--text-muted);">완료</p>
            </div>
        </div>

        <!-- Analysis Tab Content -->
        <div id="analysis-tab" class="tab-content">
            <div id="job-list">
                <div class="card" style="text-align: center; padding: 60px;">
                    <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
                    <p style="color: var(--text-muted);">분석 요청을 불러오는 중...</p>
                </div>
            </div>
        </div>

        <!-- Consultants Tab Content -->
        <div id="consultants-tab" class="tab-content" style="display: none;">
            <!-- Consultant Stats -->
            <div class="features-grid fade-in-up" style="margin-bottom: 32px;">
                <div class="feature-card" style="text-align: center;">
                    <div id="consultant-stat-total" style="font-size: 2.5rem; font-weight: 800; color: var(--primary);">
                        -</div>
                    <p style="color: var(--text-muted);">전체 컨설턴트</p>
                </div>
                <div class="feature-card" style="text-align: center;">
                    <div id="consultant-stat-pending"
                        style="font-size: 2.5rem; font-weight: 800; color: var(--warning);">-</div>
                    <p style="color: var(--text-muted);">승인 대기</p>
                </div>
                <div class="feature-card" style="text-align: center;">
                    <div id="consultant-stat-verified"
                        style="font-size: 2.5rem; font-weight: 800; color: var(--success);">-</div>
                    <p style="color: var(--text-muted);">검증됨</p>
                </div>
            </div>

            <!-- Filter -->
            <div class="card-glass"
                style="padding: 16px; margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">필터:</span>
                <button class="btn btn-sm consultant-filter-btn active" data-filter="all"
                    onclick="filterConsultants('all')">
                    전체 <span id="filter-count-all" style="opacity: 0.7;"></span>
                </button>
                <button class="btn btn-sm btn-ghost consultant-filter-btn" data-filter="pending"
                    onclick="filterConsultants('pending')">
                    <i data-lucide="clock" style="width: 14px; height: 14px;"></i>
                    승인 대기 <span id="filter-count-pending" style="opacity: 0.7;"></span>
                </button>
                <button class="btn btn-sm btn-ghost consultant-filter-btn" data-filter="verified"
                    onclick="filterConsultants('verified')">
                    <i data-lucide="badge-check" style="width: 14px; height: 14px;"></i>
                    검증됨 <span id="filter-count-verified" style="opacity: 0.7;"></span>
                </button>
                <button class="btn btn-sm btn-ghost consultant-filter-btn" data-filter="rejected"
                    onclick="filterConsultants('rejected')" style="color: var(--error);">
                    <i data-lucide="user-x" style="width: 14px; height: 14px;"></i>
                    거부됨 <span id="filter-count-rejected" style="opacity: 0.7;"></span>
                </button>
            </div>

            <div id="consultant-list-admin">
                <div class="card" style="text-align: center; padding: 60px;">
                    <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
                    <p style="color: var(--text-muted);">컨설턴트 목록을 불러오는 중...</p>
                </div>
            </div>
        </div>

        <!-- Side Panel for Details -->
        <div class="side-panel-overlay" id="side-panel-overlay" onclick="closeSidePanel()"></div>
        <div class="side-panel" id="side-panel">
            <div class="side-panel-header">
                <div>
                    <h3 id="panel-company-name">업체 상세 정보</h3>
                    <p id="panel-request-date" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                    </p>
                </div>
                <button class="close-panel-btn" onclick="closeSidePanel()" title="닫기">
                    <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
            <div class="side-panel-body" id="panel-content">
                <!-- Content will be injected by JS -->
            </div>
            <div class="side-panel-footer" id="panel-footer">
                <button class="btn btn-secondary" onclick="closeSidePanel()">닫기</button>
            </div>
        </div>

        <!-- Rejection Panel -->
        <div class="side-panel-overlay" id="reject-panel-overlay" onclick="closeRejectPanel()"></div>
        <div class="side-panel" id="reject-panel" style="max-width: 500px;">
            <div class="side-panel-header"
                style="background: rgba(239, 68, 68, 0.1); border-bottom: 1px solid rgba(239, 68, 68, 0.2);">
                <div>
                    <h3 style="color: #ef4444; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="user-x" style="width: 22px; height: 22px;"></i>
                        컨설턴트 등록 거부
                    </h3>
                    <p id="reject-consultant-name"
                        style="font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;"></p>
                </div>
                <button class="close-panel-btn" onclick="closeRejectPanel()" title="닫기">
                    <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
            <div class="side-panel-body" style="padding: 24px;">
                <input type="hidden" id="reject-consultant-id" value="">

                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 16px; color: var(--text-primary);">
                        거부 사유 선택
                    </label>

                    <div id="reject-reasons" style="display: flex; flex-direction: column; gap: 10px;">
                        <label class="reject-reason-option">
                            <input type="radio" name="reject_reason" value="자격증/경력 증빙 서류 미제출">
                            <span class="reason-radio"></span>
                            <span class="reason-text">자격증/경력 증빙 서류 미제출</span>
                        </label>
                        <label class="reject-reason-option">
                            <input type="radio" name="reject_reason" value="ISO 전문 분야 미기재 또는 부정확">
                            <span class="reason-radio"></span>
                            <span class="reason-text">ISO 전문 분야 미기재 또는 부정확</span>
                        </label>
                        <label class="reject-reason-option">
                            <input type="radio" name="reject_reason" value="연락처 정보 불완전 (이메일/전화번호)">
                            <span class="reason-radio"></span>
                            <span class="reason-text">연락처 정보 불완전 (이메일/전화번호)</span>
                        </label>
                        <label class="reject-reason-option">
                            <input type="radio" name="reject_reason" value="프로필 정보 부족 (경력, 산업 경험 등)">
                            <span class="reason-radio"></span>
                            <span class="reason-text">프로필 정보 부족 (경력, 산업 경험 등)</span>
                        </label>
                        <label class="reject-reason-option">
                            <input type="radio" name="reject_reason" value="등록 정책 위반">
                            <span class="reason-radio"></span>
                            <span class="reason-text">등록 정책 위반</span>
                        </label>
                        <label class="reject-reason-option">
                            <input type="radio" name="reject_reason" value="custom" id="custom-reason-radio">
                            <span class="reason-radio"></span>
                            <span class="reason-text">기타 (직접 입력)</span>
                        </label>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label
                        style="display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;">
                        상세 사유 또는 추가 메모
                    </label>
                    <textarea id="reject-custom-reason" rows="4" placeholder="추가 설명을 입력하세요... (선택사항)"
                        style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; color: var(--text-primary); font-size: 0.95rem; resize: vertical;"></textarea>
                </div>

                <div
                    style="background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 8px; padding: 12px; display: flex; align-items: flex-start; gap: 10px;">
                    <i data-lucide="info"
                        style="width: 18px; height: 18px; color: #f97316; flex-shrink: 0; margin-top: 2px;"></i>
                    <p style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; margin: 0;">
                        거부 사유는 해당 컨설턴트에게 이메일로 전달됩니다. 구체적인 사유를 작성하면 재등록 시 도움이 됩니다.
                    </p>
                </div>
            </div>
            <div class="side-panel-footer" style="border-top: 1px solid rgba(239, 68, 68, 0.2);">
                <button class="btn btn-secondary" onclick="closeRejectPanel()">취소</button>
                <button class="btn" id="confirm-reject-btn" onclick="confirmReject()"
                    style="flex: 1; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i data-lucide="user-x" style="width: 18px; height: 18px;"></i>
                    거부 처리
                </button>
            </div>
        </div>

        <style>
            /* Rejection Panel Styles */
            .reject-reason-option {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 16px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .reject-reason-option:hover {
                background: rgba(255, 255, 255, 0.06);
                border-color: rgba(255, 255, 255, 0.15);
            }

            .reject-reason-option:has(input:checked) {
                background: rgba(239, 68, 68, 0.1);
                border-color: rgba(239, 68, 68, 0.3);
            }

            .reject-reason-option input[type="radio"] {
                display: none;
            }

            .reason-radio {
                width: 20px;
                height: 20px;
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                position: relative;
                flex-shrink: 0;
                transition: all 0.2s ease;
            }

            .reject-reason-option:has(input:checked) .reason-radio {
                border-color: #ef4444;
            }

            .reason-radio::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0);
                width: 10px;
                height: 10px;
                background: #ef4444;
                border-radius: 50%;
                transition: transform 0.2s ease;
            }

            .reject-reason-option:has(input:checked) .reason-radio::after {
                transform: translate(-50%, -50%) scale(1);
            }

            .reason-text {
                color: var(--text-primary);
                font-size: 0.95rem;
            }

            #reject-custom-reason:focus {
                outline: none;
                border-color: rgba(239, 68, 68, 0.5);
                box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
            }
        </style>

        <script>
            lucide.createIcons();

            // Mobile Menu Toggle
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileNav = document.getElementById('mobile-nav');

            function toggleMobileMenu() {
                mobileMenuBtn.classList.toggle('active');
                mobileNav.classList.toggle('active');
                document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
            }

            function closeMobileMenu() {
                mobileMenuBtn.classList.remove('active');
                mobileNav.classList.remove('active');
                document.body.style.overflow = '';
            }

            mobileMenuBtn.addEventListener('click', toggleMobileMenu);

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    closeMobileMenu();
                }
            });

            // Global State
            let currentTab = 'analysis';
            let allConsultantsAdmin = [];
            let allJobsAdmin = []; // Store all matching requests
            let currentFilter = 'all';
            let expandedJobId = null;

            // Tab Switching
            function switchTab(tab) {
                currentTab = tab;

                // Update tab buttons
                document.querySelectorAll('.admin-tab').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`.admin-tab[onclick="switchTab('${tab}')"]`).classList.add('active');

                // Show/hide content
                document.getElementById('analysis-tab').style.display = tab === 'analysis' ? 'block' : 'none';
                document.getElementById('consultants-tab').style.display = tab === 'consultants' ? 'block' : 'none';
                document.getElementById('stats-cards').style.display = tab === 'analysis' ? 'grid' : 'none';

                if (tab === 'consultants') {
                    fetchConsultantsAdmin();
                }
            }

            // --- Analysis Jobs ---
            async function fetchJobs() {
                try {
                    const response = await fetch('/api/admin/jobs');
                    allJobsAdmin = await response.json();
                    renderJobs(allJobsAdmin);
                    updateStats(allJobsAdmin);
                } catch (error) {
                    console.error('Error fetching jobs:', error);
                    document.getElementById('job-list').innerHTML = `
                    <div class="card" style="text-align: center; padding: 40px;">
                        <i data-lucide="alert-circle" style="width: 48px; height: 48px; color: var(--error); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">데이터를 불러오지 못했습니다.</p>
                    </div>
                `;
                    lucide.createIcons();
                }
            }

            function updateStats(jobs) {
                document.getElementById('stat-total').textContent = jobs.length;
                document.getElementById('stat-pending').textContent = jobs.filter(j => j.status === 'processing').length;
                document.getElementById('stat-completed').textContent = jobs.filter(j => j.status === 'completed').length;
                document.getElementById('analysis-count').textContent = jobs.filter(j => j.status === 'processing').length;
            }

            function renderJobs(jobs) {
                const container = document.getElementById('job-list');
                container.innerHTML = '';

                if (jobs.length === 0) {
                    container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 60px;">
                        <i data-lucide="inbox" style="width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">매칭 요청이 없습니다.</p>
                    </div>
                `;
                    lucide.createIcons();
                    return;
                }

                jobs.forEach((job, index) => {
                    const card = document.createElement('div');
                    card.className = 'job-card fade-in-up';
                    card.style.animationDelay = `${index * 0.05}s`;
                    card.id = `job-card-${job.id}`;

                    const date = new Date(job.created_at).toLocaleString('ko-KR');

                    const statusConfig = {
                        'processing': { text: '대기 중', class: 'status-planning', icon: 'clock' },
                        'analyzing': { text: '진행 중', class: 'status-planning', icon: 'loader' },
                        'completed': { text: '완료', class: 'status-completed', icon: 'check-circle' },
                        'failed': { text: '실패', class: '', icon: 'x-circle', style: 'background: rgba(239, 68, 68, 0.15); color: var(--error);' },

            function toggleDetail(id) {
                const el = document.getElementById(`detail-${id}`);
                const chevron = document.getElementById(`chevron-${id}`);

                if (el) {
                    const isActive = el.classList.contains('active');

                    // Close all other details
                    document.querySelectorAll('.detail-view').forEach(d => d.classList.remove('active'));
                    document.querySelectorAll('[id^="chevron-"]').forEach(c => c.style.transform = 'rotate(0deg)');

                    if (!isActive) {
                        el.classList.add('active');
                        if (chevron) chevron.style.transform = 'rotate(180deg)';
                        expandedJobId = id; // Remember which card is expanded
                    } else {
                        expandedJobId = null; // Card was closed
                    }
                }
            }

            // --- Consultants Management ---
            async function fetchConsultantsAdmin() {
                try {
                    const response = await fetch('/api/consultants');
                    allConsultantsAdmin = await response.json();
                    updateConsultantStats();
                    renderConsultantsAdmin();
                } catch (error) {
                    console.error('Error fetching consultants:', error);
                    document.getElementById('consultant-list-admin').innerHTML = `
                    <div class="card" style="text-align: center; padding: 40px;">
                        <i data-lucide="alert-circle" style="width: 48px; height: 48px; color: var(--error); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">컨설턴트 목록을 불러오지 못했습니다.</p>
                    </div>
                `;
                    lucide.createIcons();
                }
            }

            function updateConsultantStats() {
                const total = allConsultantsAdmin.length;
                // Use status field for accurate counting
                const pending = allConsultantsAdmin.filter(c => c.status === 'pending' || (!c.status && !c.verified)).length;
                const verified = allConsultantsAdmin.filter(c => c.status === 'verified' || (!c.status && c.verified)).length;
                const rejected = allConsultantsAdmin.filter(c => c.status === 'rejected').length;

                document.getElementById('consultant-stat-total').textContent = total;
                document.getElementById('consultant-stat-pending').textContent = pending;
                document.getElementById('consultant-stat-verified').textContent = verified;
                document.getElementById('consultant-count').textContent = pending;

                // Update filter button counts
                document.getElementById('filter-count-all').textContent = `(${total})`;
                document.getElementById('filter-count-pending').textContent = `(${pending})`;
                document.getElementById('filter-count-verified').textContent = `(${verified})`;
                document.getElementById('filter-count-rejected').textContent = `(${rejected})`;
            }

            function filterConsultants(filter) {
                currentFilter = filter;

                // Update filter buttons
                document.querySelectorAll('.consultant-filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    btn.classList.add('btn-ghost');
                });
                const activeBtn = document.querySelector(`.consultant-filter-btn[data-filter="${filter}"]`);
                if (activeBtn) {
                    activeBtn.classList.add('active');
                    activeBtn.classList.remove('btn-ghost');
                }

                renderConsultantsAdmin();
            }

            function renderConsultantsAdmin() {
                const container = document.getElementById('consultant-list-admin');
                container.innerHTML = '';

                let consultantsToShow = allConsultantsAdmin;

                // Status-based filtering
                if (currentFilter === 'pending') {
                    consultantsToShow = allConsultantsAdmin.filter(c => c.status === 'pending' || (!c.status && !c.verified && c.status !== 'rejected'));
                } else if (currentFilter === 'verified') {
                    consultantsToShow = allConsultantsAdmin.filter(c => c.status === 'verified' || (!c.status && c.verified));
                } else if (currentFilter === 'rejected') {
                    consultantsToShow = allConsultantsAdmin.filter(c => c.status === 'rejected');
                }

                if (consultantsToShow.length === 0) {
                    container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 60px;">
                        <i data-lucide="users" style="width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">해당 조건의 컨설턴트가 없습니다.</p>
                    </div>
                `;
                    lucide.createIcons();
                    return;
                }

                consultantsToShow.forEach((consultant, index) => {
                    const card = document.createElement('div');
                    card.className = 'consultant-approval-card fade-in-up';
                    card.style.animationDelay = `${index * 0.05}s`;

                    // Status-based styling
                    const status = consultant.status || (consultant.verified ? 'verified' : 'pending');
                    let statusClass = 'pending';
                    let statusText = '승인 대기';

                    if (status === 'verified') {
                        statusClass = 'verified';
                        statusText = '검증됨';
                    } else if (status === 'rejected') {
                        statusClass = 'rejected';
                        statusText = '거부됨';
                        card.style.opacity = '0.7';
                        card.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                    }

                    // Parse ISO experience
                    let isoList = [];
                    if (consultant.isoExperience && typeof consultant.isoExperience === 'object') {
                        isoList = Object.keys(consultant.isoExperience);
                    }

                    // Parse industry experience
                    let industryList = consultant.industryExperience || [];

                    // Avatar logic
                    const avatarContent = consultant.profileImageUrl
                        ? `<img src="${consultant.profileImageUrl}" style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit;">`
                        : (consultant.avatar || consultant.name[0]);

                    // Rejection info (for rejected consultants)
                    const rejectionInfo = status === 'rejected' ? `
                        <div style="margin-top: 12px; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; border-left: 3px solid #ef4444;">
                            <div style="font-size: 0.8rem; color: var(--error); font-weight: 500; margin-bottom: 4px;">거부 사유:</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">${consultant.rejectionReason || '사유 미기재'}</div>
                            ${consultant.rejectedAt ? `<div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">거부일: ${new Date(consultant.rejectedAt).toLocaleDateString('ko-KR')}</div>` : ''}
                        </div>
                    ` : '';

                    // Action buttons based on status
                    let actionButtons = '';
                    if (status === 'rejected') {
                        actionButtons = `
                            <button class="btn btn-secondary btn-sm" onclick="viewConsultantDetails('${consultant.id}')">
                                <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                                상세 보기
                            </button>
                            <button class="btn btn-sm" style="background: rgba(16, 185, 129, 0.15); color: var(--primary);" onclick="restoreConsultant(${consultant.id})">
                                <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
                                복구
                            </button>
                        `;
                    } else if (status === 'verified') {
                        actionButtons = `
                            <button class="btn btn-secondary btn-sm" onclick="viewConsultantDetails('${consultant.id}')">
                                <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                                상세 보기
                            </button>
                            <button class="btn btn-ghost btn-sm" onclick="revokeVerification(${consultant.id})">
                                <i data-lucide="shield-off" style="width: 16px; height: 16px;"></i>
                                검증 취소
                            </button>
                        `;
                    } else {
                        actionButtons = `
                            <button class="btn btn-secondary btn-sm" onclick="viewConsultantDetails('${consultant.id}')">
                                <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                                상세 보기
                            </button>
                            <button class="btn btn-approve btn-sm" onclick="approveConsultant(${consultant.id})">
                                <i data-lucide="check" style="width: 16px; height: 16px;"></i>
                                승인
                            </button>
                            <button class="btn btn-reject btn-sm" onclick="rejectConsultant(${consultant.id})">
                                <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                                거부
                            </button>
                        `;
                    }

                    card.innerHTML = `
                    <div class="consultant-approval-header">
                        <div class="consultant-approval-info">
                            <div class="consultant-approval-avatar" ${status === 'rejected' ? 'style="filter: grayscale(50%);"' : ''}>${avatarContent}</div>
                            <div class="consultant-approval-details">
                                <h3>${consultant.name}</h3>
                                <p>${consultant.specialty || '종합'} 전문 · 경력 ${consultant.experience || '-'}</p>
                            </div>
                        </div>
                        <span class="consultant-approval-status ${statusClass}">${statusText}</span>
                    </div>
                    
                    <div class="consultant-approval-body">
                        <div class="approval-info-item">
                            <label>ISO 규격</label>
                            <span>${isoList.length > 0 ? isoList.map(iso => 'ISO ' + iso).join(', ') : '-'}</span>
                        </div>
                        <div class="approval-info-item">
                            <label>산업 경험</label>
                            <span>${industryList.length > 0 ? industryList.join(', ') : '-'}</span>
                        </div>
                        <div class="approval-info-item">
                            <label>신뢰 점수</label>
                            <span style="color: var(--primary);">${consultant.trustScore || 50}점</span>
                        </div>
                        <div class="approval-info-item">
                            <label>리뷰 수</label>
                            <span>${consultant.reviews || 0}개</span>
                        </div>
                        ${rejectionInfo}
                    </div>
                    
                    <div class="consultant-approval-actions">
                        ${actionButtons}
                    </div>
                `;

                    container.appendChild(card);
                });

                lucide.createIcons();
            }

            // Consultant Approval Actions
            async function approveConsultant(id) {
                if (!confirm('이 컨설턴트를 승인하시겠습니까?')) return;

                try {
                    const response = await fetch(`/api/admin/consultants/${id}/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        showNotification('컨설턴트가 승인되었습니다.', 'success');
                        fetchConsultantsAdmin();
                    } else {
                        showNotification('승인 처리 중 오류가 발생했습니다.', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('서버 연결에 실패했습니다.', 'error');
                }
            }
            // Rejection Panel Functions
            function rejectConsultant(id) {
                const consultant = allConsultantsAdmin.find(c => c.id == id);
                if (!consultant) return;

                // Set consultant info
                document.getElementById('reject-consultant-id').value = id;
                document.getElementById('reject-consultant-name').textContent = `${consultant.name} 전문가`;

                // Reset form
                document.querySelectorAll('input[name="reject_reason"]').forEach(r => r.checked = false);
                document.getElementById('reject-custom-reason').value = '';

                // Open panel
                openRejectPanel();
            }

            function openRejectPanel() {
                document.getElementById('reject-panel-overlay').classList.add('active');
                document.getElementById('reject-panel').classList.add('active');
                document.body.style.overflow = 'hidden';
                lucide.createIcons();
            }

            function closeRejectPanel() {
                document.getElementById('reject-panel-overlay').classList.remove('active');
                document.getElementById('reject-panel').classList.remove('active');
                document.body.style.overflow = '';
            }

            async function confirmReject() {
                const id = document.getElementById('reject-consultant-id').value;
                const selectedReason = document.querySelector('input[name="reject_reason"]:checked');
                const customReason = document.getElementById('reject-custom-reason').value.trim();

                if (!selectedReason) {
                    showNotification('거부 사유를 선택해주세요.', 'error');
                    return;
                }

                let reason = selectedReason.value;

                // If custom is selected, use the textarea value
                if (reason === 'custom') {
                    if (!customReason) {
                        showNotification('거부 사유를 직접 입력해주세요.', 'error');
                        return;
                    }
                    reason = customReason;
                } else if (customReason) {
                    // Append additional notes if provided
                    reason = reason + ' - ' + customReason;
                }

                // Show loading state
                const confirmBtn = document.getElementById('confirm-reject-btn');
                const originalHTML = confirmBtn.innerHTML;
                confirmBtn.innerHTML = '<div class="loading-spinner" style="width: 18px; height: 18px;"></div> 처리 중...';
                confirmBtn.disabled = true;

                try {
                    const response = await fetch(`/api/admin/consultants/${id}/reject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ reason })
                    });

                    if (response.ok) {
                        closeRejectPanel();
                        showNotification('컨설턴트 등록이 거부되었습니다.', 'success');
                        fetchConsultantsAdmin();
                    } else {
                        showNotification('처리 중 오류가 발생했습니다.', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('서버 연결에 실패했습니다.', 'error');
                } finally {
                    confirmBtn.innerHTML = originalHTML;
                    confirmBtn.disabled = false;
                    lucide.createIcons();
                }
            }

            async function revokeVerification(id) {
                if (!confirm('이 컨설턴트의 검증을 취소하시겠습니까?')) return;

                try {
                    const response = await fetch(`/api/admin/consultants/${id}/revoke`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        showNotification('검증이 취소되었습니다.', 'success');
                        fetchConsultantsAdmin();
                    } else {
                        showNotification('처리 중 오류가 발생했습니다.', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('서버 연결에 실패했습니다.', 'error');
                }
            }

            async function restoreConsultant(id) {
                if (!confirm('이 컨설턴트를 승인 대기 상태로 복구하시겠습니까?')) return;

                try {
                    const response = await fetch(`/api/admin/consultants/${id}/restore`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        showNotification('컨설턴트가 승인 대기 상태로 복구되었습니다.', 'success');
                        fetchConsultantsAdmin();
                    } else {
                        const data = await response.json();
                        showNotification(data.message || '처리 중 오류가 발생했습니다.', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('서버 연결에 실패했습니다.', 'error');
                }
            }

            // Delete Job (Matching Request)
            async function deleteJob(jobId, companyName) {
                // Custom confirmation
                const confirmed = confirm(`"${companyName}" 매칭 요청을 삭제하시겠습니까?\n\n삭제된 요청은 복구할 수 없습니다.`);
                if (!confirmed) return;

                try {
                    const response = await fetch(`/api/admin/jobs/${jobId}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showNotification(`"${companyName}" 매칭 요청이 삭제되었습니다.`, 'success');
                        // Remove card from UI with animation
                        const card = document.getElementById(`job-card-${jobId}`);
                        if (card) {
                            card.style.transition = 'opacity 0.3s, transform 0.3s';
                            card.style.opacity = '0';
                            card.style.transform = 'translateX(20px)';
                            setTimeout(() => {
                                card.remove();
                                // Refresh stats
                                fetchJobs();
                            }, 300);
                        } else {
                            fetchJobs();
                        }
                    } else {
                        showNotification(data.message || '삭제 중 오류가 발생했습니다.', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('서버 연결에 실패했습니다.', 'error');
                }
            }

            // View Consultant Details - Show in side panel
            function viewConsultantDetails(consultantId) {
                const consultant = allConsultantsAdmin.find(c => c.id == consultantId);
                if (!consultant) return;

                // Set Header Title
                document.getElementById('panel-company-name').textContent = '컨설턴트 상세 정보';
                document.getElementById('panel-request-date').textContent = `${consultant.name} 전문가`;

                // Parse ISO experience with roles
                let isoHtml = '';
                if (consultant.isoExperience && typeof consultant.isoExperience === 'object') {
                    const isoEntries = Object.entries(consultant.isoExperience);
                    if (isoEntries.length > 0) {
                        isoHtml = isoEntries.map(([code, role]) => {
                            const roleText = role === 'Lead Auditor' ? '선임심사원'
                                : role === 'Auditor' ? '심사원'
                                    : role === 'Consultant' ? '컨설턴트'
                                        : role === 'Trainer' ? '교육강사'
                                            : role || '미지정';
                            return `<span style="display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; margin: 4px 4px 4px 0;">
                            <span style="font-weight: 600; color: var(--primary);">ISO ${code}</span>
                            <span style="color: var(--text-muted);">(${roleText})</span>

                        }).join('');
                    } else {
                        isoHtml = '<span style="color: var(--text-muted);">미지정</span>';

                const projectTypes = consultant.projectTypes || [];

                const roles = consultant.roles || [];

                    if (!items || items.length === 0) return `<span style="color: var(--text-muted);">${emptyText}</span>`;

                    'Small': '소기업', 'Medium': '중소기업', 'MidLarge': '중견기업', 'Large': '대기업'

                // Set Header with Avatar

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <label class="info-label">📧 이메일</label>

                        </div>
                        <div>
                            <label class="info-label">📞 연락처</label>
                            <div class="info-value">${consultant.phone || '미등록'}</div>

                    </div>
                </div>

                <!-- 전문 분야 (ISO) -->
                <div class="info-group" style="margin-top: 24px;">
                    <h4 style="margin-bottom: 16px; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; display: flex; align-items: center; gap: 8px;">

                    </h4>
                    <div style="margin-bottom: 12px;">
                        ${isoHtml}
                    </div>
                </div>

                <!-- 활동 지역 -->
                <div class="info-group" style="margin-top: 24px;">
                    <h4 style="margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="map-pin" style="width: 16px; height: 16px; color: var(--text-muted);"></i>

                    </h4>
                    <div>${renderTags(regions)}</div>
                </div>

                <!-- 산업 경험 -->
                <div class="info-group" style="margin-top: 24px;">
                    <h4 style="margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="factory" style="width: 16px; height: 16px; color: var(--text-muted);"></i>
                        경험 산업군
                    </h4>
                    <div>${renderTags(industryList)}</div>
                </div>

                <!-- 프로젝트 유형/조직 규모 -->
                <div class="info-group" style="margin-top: 24px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div>
                            <h4 style="margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; font-size: 0.95rem;">
                                <i data-lucide="folder-check" style="width: 16px; height: 16px; color: var(--text-muted);"></i>
                                프로젝트 유형
                            </h4>
                            <div>${renderTags(translatedProjectTypes)}</div>
                        </div>
                        <div>
                            <h4 style="margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; font-size: 0.95rem;">
                                <i data-lucide="users" style="width: 16px; height: 16px; color: var(--text-muted);"></i>

                            <div>${renderTags(translatedOrgSizes)}</div>

                    </div>
                </div>

                <!-- 수행 가능 역할 -->
                <div class="info-group" style="margin-top: 24px;">
                    <h4 style="margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="user-check" style="width: 16px; height: 16px; color: var(--text-muted);"></i>

                    </h4>
                    <div>${renderTags(translatedRoles)}</div>

                <!-- 한줄 소개 -->
                <div class="info-group" style="margin-top: 24px;">
                    <h4 style="margin-bottom: 12px; color: var(--text-primary);">💬 한줄 소개</h4>
                    <div class="info-value" style="background: rgba(16, 185, 129, 0.05); padding: 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.6; border-left: 3px solid var(--primary);">

                    </div>
                </div>

                <!-- 성과 지표 -->
                <div class="info-group" style="margin-top: 32px;">
                    <h4 style="margin-bottom: 16px; color: var(--warning); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="bar-chart-3" style="width: 18px; height: 18px;"></i>

                    </h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center;">
                        <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 12px;">
                            <div class="info-label" style="margin-bottom: 8px;">신뢰 점수</div>
                            <div class="info-value" style="color: var(--primary); font-size: 1.5rem; font-weight: 700;">${consultant.trustScore || 50}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 12px;">
                            <div class="info-label" style="margin-bottom: 8px;">평점</div>
                            <div class="info-value" style="font-size: 1.5rem; font-weight: 700;">⭐ ${consultant.rating || 0}</div>

            `;

                document.getElementById('panel-content').innerHTML = contentHtml;

                // Update Footer Buttons
                let footerHtml = `
                <button class="btn btn-secondary" onclick="closeSidePanel()">닫기</button>

                    <button class="btn btn-primary" style="flex: 1;" onclick="approveConsultant(${consultant.id}); closeSidePanel();">

                // Re-create icons
                lucide.createIcons();

                // Open Panel
                openSidePanel();

            // Side Panel Controls
            function openSidePanel() {
                document.getElementById('side-panel-overlay').classList.add('active');
                document.getElementById('side-panel').classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidePanel() {
                document.getElementById('side-panel-overlay').classList.remove('active');
                document.getElementById('side-panel').classList.remove('active');
                document.body.style.overflow = '';
            }

            // View Job Details - Navigate to dashboard or show side panel
            function viewJobDetails(jobId) {
                const job = allJobsAdmin.find(j => j.id === jobId);
                if (!job) return;

                const intake = job.intake_data || {};
                const date = new Date(job.created_at).toLocaleString('ko-KR');

                // Build Body Content

                <div class="info-group">
                    <h4 style="margin-bottom: 16px; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
                        매칭 요청 원문
                    </h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <label class="info-label">희망 규격</label>
                            <div class="info-value">${(intake.standards || []).join(', ') || '미지정'}</div>

                        <div>
                            <label class="info-label">직원 수</label>
                            <div class="info-value">${intake.employees || '미지정'}</div>
                        </div>
                        <div>
                            <label class="info-label">희망 일정</label>
                            <div class="info-value">${intake.timeline || '유연함'}</div>
                        </div>
                        <div>
                            <label class="info-label">예산</label>
                            <div class="info-value">${intake.budget || '미정'}</div>
                        </div>
                        <div>
                            <label class="info-label">지역</label>
                            <div class="info-value">${intake.region || '전국'}</div>
                        </div>

                </div>

                <div class="info-group">
                    <label class="info-label">이슈 및 요구사항</label>
                    <div class="info-value" style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; font-size: 0.9rem;">

                </div>

                <div class="info-group" style="margin-top: 32px;">

                        매칭된 컨설턴트 상세
                    </h4>
                    ${job.related_projects && job.related_projects.length > 0 ?

                                ? `<img src="${p.profile_image_url}" style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit;">`

                            return `

                                        <div style="display: flex; justify-content: space-between; align-items: center;">
                                            <span style="font-weight: 600; font-size: 1.05rem;">${p.consultant_name}</span>

                                        <div style="font-size: 0.8rem; color: var(--text-muted);">${p.title}</div>

                                </div>
                            </div>
                        `;
                        }).join('') : '<p style="color: var(--text-muted); text-align: center; padding: 20px;">매칭된 컨설턴트 데이터가 없습니다.</p>'

                </div>
            `;

                document.getElementById('panel-content').innerHTML = contentHtml;

                // Update Footer Buttons
                let footerHtml = `
                <button class="btn btn-secondary" onclick="closeSidePanel()">닫기</button>
                ${intake.contact_email ? `
                    <a href="mailto:${intake.contact_email}" class="btn btn-primary" style="flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px;">

                        업체에 메일 보내기
                    </a>
                ` : ''}
                <button class="btn btn-sm" style="background: rgba(239, 68, 68, 0.15); color: var(--error);" onclick="deleteJob('${job.id}', '${job.company_name}'); closeSidePanel();">
                    삭제
                </button>
            `;
                document.getElementById('panel-footer').innerHTML = footerHtml;

                // Re-create icons
                lucide.createIcons();

                // Open Panel
                openSidePanel();
            }

            // Notification
            function showNotification(message, type) {
                const existing = document.querySelector('.notification');
                if (existing) existing.remove();

                const notification = document.createElement('div');
                const bgColor = type === 'success' ? 'rgba(16, 185, 129, 0.9)' : 'rgba(239, 68, 68, 0.9)';

                notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 24px;
                padding: 16px 24px;
                background: ${bgColor};
                color: white;
                border-radius: 12px;
                z-index: 10000;
                animation: slideIn 0.3s ease;
                backdrop-filter: blur(10px);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                max-width: 400px;
            `;
                notification.textContent = message;
                document.body.appendChild(notification);

                setTimeout(() => notification.remove(), 4000);
            }

            // Manual Refresh Function
            function refreshData() {
                fetchJobs();
                if (currentTab === 'consultants') {
                    fetchConsultantsAdmin();
                }
                showNotification('데이터를 갱신했습니다.', 'success');
            }

            // Initial fetch only
            fetchJobs();
        </script>
</body>

</html>
