<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - InsightMatch</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Side Panel Styles */
        .side-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .side-panel-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-panel {
            position: fixed;
            top: 0;
            right: -600px;
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: rgba(23, 23, 23, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2001;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .side-panel.active {
            right: 0;
        }

        .side-panel-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .close-panel-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0;
        }

        .close-panel-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
            transform: rotate(90deg);
        }

        .side-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .side-panel-footer {
            padding: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            background: rgba(20, 20, 20, 0.5);
        }

        .info-group {
            margin-bottom: 24px;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .info-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        .consultant-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }

        .consultant-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <div class="logo-icon" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">
                    <i data-lucide="shield" style="width: 20px; height: 20px;"></i>
                </div>
                <div class="logo-text">
                    <span>InsightMatch</span>
                    <span style="color: var(--warning);">Admin Panel</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="index.html">
                    <i data-lucide="home" style="width: 16px; height: 16px;"></i>
                    메인 사이트
                </a>
            </div>

            <div class="nav-actions">
                <span style="display: flex; align-items: center; gap: 8px; color: var(--warning);">
                    <i data-lucide="crown" style="width: 18px; height: 18px;"></i>
                    관리자
                </span>
            </div>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobile-nav">
        <span style="display: flex; align-items: center; gap: 8px; color: var(--warning); justify-content: center;">
            <i data-lucide="crown" style="width: 18px; height: 18px;"></i>
            관리자
        </span>
        <div class="nav-divider"></div>
        <a href="index.html" onclick="closeMobileMenu()">
            <i data-lucide="home"
                style="width: 16px; height: 16px; display: inline; vertical-align: middle; margin-right: 8px;"></i>
            메인 사이트
        </a>
    </div>

    <!-- Admin Container -->
    <div class="container admin-container">
        <div class="fade-in-up"
            style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1 style="font-size: 2rem; margin-bottom: 8px;">관리자 대시보드</h1>
                <p style="color: var(--text-muted);">업체의 컨설팅 매칭 요청과 컨설턴트를 관리하세요.</p>
            </div>
            <button class="btn btn-secondary" onclick="refreshData()"
                style="display: flex; align-items: center; gap: 8px;">
                <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i>
                새로고침
            </button>
        </div>

        <!-- Admin Tabs -->
        <div class="admin-tabs fade-in-up">
            <button class="admin-tab active" onclick="switchTab('analysis')">
                <i data-lucide="handshake" style="width: 18px; height: 18px;"></i>
                매칭 요청
                <span class="badge-count" id="analysis-count">-</span>
            </button>
            <button class="admin-tab" onclick="switchTab('consultants')">
                <i data-lucide="users" style="width: 18px; height: 18px;"></i>
                컨설턴트 승인
                <span class="badge-count" id="consultant-count">-</span>
            </button>
        </div>

        <!-- Stats Cards -->
        <div class="features-grid fade-in-up" style="margin-bottom: 40px;" id="stats-cards">
            <div class="feature-card" style="text-align: center;">
                <div id="stat-total" style="font-size: 2.5rem; font-weight: 800; color: var(--primary);">-</div>
                <p style="color: var(--text-muted);">전체 요청</p>
            </div>
            <div class="feature-card" style="text-align: center;">
                <div id="stat-pending" style="font-size: 2.5rem; font-weight: 800; color: var(--warning);">-</div>
                <p style="color: var(--text-muted);">대기 중</p>
            </div>
            <div class="feature-card" style="text-align: center;">
                <div id="stat-completed" style="font-size: 2.5rem; font-weight: 800; color: var(--success);">-</div>
                <p style="color: var(--text-muted);">완료</p>
            </div>
        </div>

        <!-- Analysis Tab Content -->
        <div id="analysis-tab" class="tab-content">
            <div id="job-list">
                <div class="card" style="text-align: center; padding: 60px;">
                    <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
                    <p style="color: var(--text-muted);">분석 요청을 불러오는 중...</p>
                </div>
            </div>
        </div>

        <!-- Consultants Tab Content -->
        <div id="consultants-tab" class="tab-content" style="display: none;">
            <!-- Consultant Stats -->
            <div class="features-grid fade-in-up" style="margin-bottom: 32px;">
                <div class="feature-card" style="text-align: center;">
                    <div id="consultant-stat-total" style="font-size: 2.5rem; font-weight: 800; color: var(--primary);">
                        -</div>
                    <p style="color: var(--text-muted);">전체 컨설턴트</p>
                </div>
                <div class="feature-card" style="text-align: center;">
                    <div id="consultant-stat-pending"
                        style="font-size: 2.5rem; font-weight: 800; color: var(--warning);">-</div>
                    <p style="color: var(--text-muted);">승인 대기</p>
                </div>
                <div class="feature-card" style="text-align: center;">
                    <div id="consultant-stat-verified"
                        style="font-size: 2.5rem; font-weight: 800; color: var(--success);">-</div>
                    <p style="color: var(--text-muted);">검증됨</p>
                </div>
            </div>

            <!-- Filter -->
            <div class="card-glass"
                style="padding: 16px; margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">필터:</span>
                <button class="btn btn-sm consultant-filter-btn active" data-filter="all"
                    onclick="filterConsultants('all')">
                    전체
                </button>
                <button class="btn btn-sm btn-ghost consultant-filter-btn" data-filter="pending"
                    onclick="filterConsultants('pending')">
                    <i data-lucide="clock" style="width: 14px; height: 14px;"></i>
                    승인 대기
                </button>
                <button class="btn btn-sm btn-ghost consultant-filter-btn" data-filter="verified"
                    onclick="filterConsultants('verified')">
                    <i data-lucide="badge-check" style="width: 14px; height: 14px;"></i>
                    검증됨
                </button>
            </div>

            <div id="consultant-list-admin">
                <div class="card" style="text-align: center; padding: 60px;">
                    <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
                    <p style="color: var(--text-muted);">컨설턴트 목록을 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Side Panel for Details -->
    <div class="side-panel-overlay" id="side-panel-overlay" onclick="closeSidePanel()"></div>
    <div class="side-panel" id="side-panel">
        <div class="side-panel-header">
            <div>
                <h3 id="panel-company-name">업체 상세 정보</h3>
                <p id="panel-request-date" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;"></p>
            </div>
            <button class="close-panel-btn" onclick="closeSidePanel()" title="닫기">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>
        <div class="side-panel-body" id="panel-content">
            <!-- Content will be injected by JS -->
        </div>
        <div class="side-panel-footer" id="panel-footer">
            <button class="btn btn-secondary" onclick="closeSidePanel()">닫기</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileNav = document.getElementById('mobile-nav');

        function toggleMobileMenu() {
            mobileMenuBtn.classList.toggle('active');
            mobileNav.classList.toggle('active');
            document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        }

        function closeMobileMenu() {
            mobileMenuBtn.classList.remove('active');
            mobileNav.classList.remove('active');
            document.body.style.overflow = '';
        }

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeMobileMenu();
            }
        });

        // Global State
        let currentTab = 'analysis';
        let allConsultantsAdmin = [];
        let allJobsAdmin = []; // Store all matching requests
        let currentFilter = 'all';
        let expandedJobId = null;

        // Tab Switching
        function switchTab(tab) {
            currentTab = tab;

            // Update tab buttons
            document.querySelectorAll('.admin-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.admin-tab[onclick="switchTab('${tab}')"]`).classList.add('active');

            // Show/hide content
            document.getElementById('analysis-tab').style.display = tab === 'analysis' ? 'block' : 'none';
            document.getElementById('consultants-tab').style.display = tab === 'consultants' ? 'block' : 'none';
            document.getElementById('stats-cards').style.display = tab === 'analysis' ? 'grid' : 'none';

            if (tab === 'consultants') {
                fetchConsultantsAdmin();
            }
        }

        // --- Analysis Jobs ---
        async function fetchJobs() {
            try {
                const response = await fetch('/api/admin/jobs');
                allJobsAdmin = await response.json();
                renderJobs(allJobsAdmin);
                updateStats(allJobsAdmin);
            } catch (error) {
                console.error('Error fetching jobs:', error);
                document.getElementById('job-list').innerHTML = `
                    <div class="card" style="text-align: center; padding: 40px;">
                        <i data-lucide="alert-circle" style="width: 48px; height: 48px; color: var(--error); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">데이터를 불러오지 못했습니다.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function updateStats(jobs) {
            document.getElementById('stat-total').textContent = jobs.length;
            document.getElementById('stat-pending').textContent = jobs.filter(j => j.status === 'processing').length;
            document.getElementById('stat-completed').textContent = jobs.filter(j => j.status === 'completed').length;
            document.getElementById('analysis-count').textContent = jobs.filter(j => j.status === 'processing').length;
        }

        function renderJobs(jobs) {
            const container = document.getElementById('job-list');
            container.innerHTML = '';

            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 60px;">
                        <i data-lucide="inbox" style="width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">매칭 요청이 없습니다.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            jobs.forEach((job, index) => {
                const card = document.createElement('div');
                card.className = 'job-card fade-in-up';
                card.style.animationDelay = `${index * 0.05}s`;
                card.id = `job-card-${job.id}`;

                const date = new Date(job.created_at).toLocaleString('ko-KR');

                const statusConfig = {
                    'processing': { text: '대기 중', class: 'status-planning', icon: 'clock' },
                    'analyzing': { text: '진행 중', class: 'status-planning', icon: 'loader' },
                    'completed': { text: '완료', class: 'status-completed', icon: 'check-circle' },
                    'failed': { text: '실패', class: '', icon: 'x-circle', style: 'background: rgba(239, 68, 68, 0.15); color: var(--error);' },
                    'deleted': { text: '삭제됨', class: '', icon: 'trash-2', style: 'background: rgba(107, 114, 128, 0.15); color: var(--text-muted);' }
                };
                const status = statusConfig[job.status] || statusConfig['processing'];

                // Build matching info from intake_data
                const intake = job.intake_data || {};
                const standards = intake.standards || [];
                const standardsText = standards.length > 0
                    ? standards.map(s => typeof s === 'string' ? s : s.code || s).join(', ')
                    : '미지정';

                // Related projects/consultants
                const projects = job.related_projects || [];
                const projectCount = job.project_count || 0;

                // Consultants section - always show, even if empty
                let consultantsHtml = '';
                if (projectCount > 0) {
                    consultantsHtml = `
                        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <h5 style="font-size: 0.95rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                                <i data-lucide="users" style="width: 16px; height: 16px; color: var(--primary);"></i>
                                매칭된 컨설턴트: ${projectCount}명
                            </h5>
                            <ul style="list-style: none; padding: 0; margin: 0;">
                                ${projects.map(p => {
                        const statusText = p.status === 'contracted' ? '계약 완료'
                            : p.status === 'in_progress' ? '진행중'
                                : p.status === 'proposal_pending' ? '견적 대기'
                                    : p.status === 'proposal_submitted' ? '견적 발송 완료'
                                        : p.status === 'awaiting_signature' ? '서명 대기'
                                            : p.status === 'completed' ? '완료'
                                                : p.status;
                        // Extract ISO standard from project title (e.g., "ISO 9001:2015 인증 프로젝트" -> "ISO 9001:2015")
                        const isoMatch = p.title ? p.title.match(/(ISO[\s\/]?\w+[:\s]?\d*)/i) : null;
                        const isoStandard = isoMatch ? isoMatch[1].trim() : '';
                        return `
                                        <li style="padding: 8px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                            <span style="color: var(--text-primary); font-weight: 500;">• ${p.consultant_name}</span>
                                            ${isoStandard ? `<span style="background: rgba(16, 185, 129, 0.15); color: var(--secondary); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">${isoStandard}</span>` : ''}
                                            <span style="color: var(--text-muted); font-size: 0.85rem;">(${statusText})</span>
                                        </li>
                                    `;
                    }).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    consultantsHtml = `
                        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <h5 style="font-size: 0.95rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-muted);">
                                <i data-lucide="users" style="width: 16px; height: 16px;"></i>
                                매칭된 컨설턴트: 0명
                            </h5>
                            <p style="color: var(--text-muted); font-size: 0.9rem;">아직 매칭된 컨설턴트가 없습니다.</p>
                        </div>
                    `;
                }

                let detailHtml = `
                    <div class="detail-view" id="detail-${job.id}">
                        <!-- 요청 정보 섹션 -->
                        <div style="margin-bottom: 16px;">
                            <h5 style="font-size: 0.95rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                                <i data-lucide="clipboard-list" style="width: 16px; height: 16px; color: var(--primary);"></i>
                                요청 정보
                            </h5>
                            <ul style="list-style: none; padding: 0; margin: 0;">
                                <li style="padding: 6px 0; display: flex; align-items: flex-start; gap: 8px;">
                                    <span style="color: var(--text-muted); min-width: 80px;">• 희망 규격:</span>
                                    <span style="color: var(--text-primary);">${standardsText}</span>
                                </li>
                                <li style="padding: 6px 0; display: flex; align-items: flex-start; gap: 8px;">
                                    <span style="color: var(--text-muted); min-width: 80px;">• 업종:</span>
                                    <span style="color: var(--text-primary);">${intake.industry || '미지정'}</span>
                                </li>
                                <li style="padding: 6px 0; display: flex; align-items: flex-start; gap: 8px;">
                                    <span style="color: var(--text-muted); min-width: 80px;">• 직원 수:</span>
                                    <span style="color: var(--text-primary);">${intake.employees || '미지정'}</span>
                                </li>
                                <li style="padding: 6px 0; display: flex; align-items: flex-start; gap: 8px;">
                                    <span style="color: var(--text-muted); min-width: 80px;">• 프로젝트 유형:</span>
                                    <span style="color: var(--text-primary);">${intake.timeline === 'urgent' ? '긴급' : intake.timeline === 'flexible' ? '유연함' : intake.timeline || '신규 인증'}</span>
                                </li>
                            </ul>
                        </div>
                        
                        <!-- 매칭된 컨설턴트 섹션 -->
                        ${consultantsHtml}
                        
                        <!-- 액션 버튼 -->
                        <div style="display: flex; justify-content: flex-start; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <button class="btn btn-secondary btn-sm" onclick="viewJobDetails('${job.id}')">
                                <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                                상세 보기
                            </button>
                            ${intake.contact_email ? `
                                <a href="mailto:${intake.contact_email}" class="btn btn-secondary btn-sm">
                                    <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
                                    이메일 발송
                                </a>
                            ` : ''}
                            <button class="btn btn-sm" style="background: rgba(239, 68, 68, 0.15); color: var(--error);" onclick="deleteJob('${job.id}', '${job.company_name}')">
                                <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                                삭제
                            </button>
                        </div>
                    </div>
                `;

                card.innerHTML = `
                    <div class="job-header" onclick="toggleDetail('${job.id}')">
                        <div class="job-info">
                            <h3 style="display: flex; align-items: center; gap: 8px;">
                                <i data-lucide="building-2" style="width: 18px; height: 18px; color: var(--primary);"></i>
                                ${job.company_name}
                                ${projectCount > 0 ? `<span style="font-size: 0.8rem; color: var(--success); font-weight: 500;">(컨설턴트 ${projectCount}명 매칭)</span>` : ''}
                            </h3>
                            <div class="job-meta" style="margin-top: 4px;">
                                ${intake.industry ? `<span style="margin-right: 16px;"><i data-lucide="briefcase" style="width: 12px; height: 12px; display: inline; vertical-align: middle;"></i> ${intake.industry}</span>` : ''}
                                <span><i data-lucide="clock" style="width: 12px; height: 12px; display: inline; vertical-align: middle;"></i> ${date}</span>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span class="status-badge ${status.class}" ${status.style ? `style="${status.style}"` : ''}>
                                <i data-lucide="${status.icon}" style="width: 14px; height: 14px;"></i>
                                ${status.text}
                            </span>
                            <i data-lucide="chevron-down" style="width: 20px; height: 20px; color: var(--text-muted); transition: transform 0.3s;" id="chevron-${job.id}"></i>
                        </div>
                    </div>
                    ${detailHtml}
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function toggleDetail(id) {
            const el = document.getElementById(`detail-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);

            if (el) {
                const isActive = el.classList.contains('active');

                // Close all other details
                document.querySelectorAll('.detail-view').forEach(d => d.classList.remove('active'));
                document.querySelectorAll('[id^="chevron-"]').forEach(c => c.style.transform = 'rotate(0deg)');

                if (!isActive) {
                    el.classList.add('active');
                    if (chevron) chevron.style.transform = 'rotate(180deg)';
                    expandedJobId = id; // Remember which card is expanded
                } else {
                    expandedJobId = null; // Card was closed
                }
            }
        }

        // --- Consultants Management ---
        async function fetchConsultantsAdmin() {
            try {
                const response = await fetch('/api/consultants');
                allConsultantsAdmin = await response.json();
                updateConsultantStats();
                renderConsultantsAdmin();
            } catch (error) {
                console.error('Error fetching consultants:', error);
                document.getElementById('consultant-list-admin').innerHTML = `
                    <div class="card" style="text-align: center; padding: 40px;">
                        <i data-lucide="alert-circle" style="width: 48px; height: 48px; color: var(--error); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">컨설턴트 목록을 불러오지 못했습니다.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function updateConsultantStats() {
            const total = allConsultantsAdmin.length;
            const pending = allConsultantsAdmin.filter(c => !c.verified).length;
            const verified = allConsultantsAdmin.filter(c => c.verified).length;

            document.getElementById('consultant-stat-total').textContent = total;
            document.getElementById('consultant-stat-pending').textContent = pending;
            document.getElementById('consultant-stat-verified').textContent = verified;
            document.getElementById('consultant-count').textContent = pending;
        }

        function filterConsultants(filter) {
            currentFilter = filter;

            // Update filter buttons
            document.querySelectorAll('.consultant-filter-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('btn-ghost');
            });
            const activeBtn = document.querySelector(`.consultant-filter-btn[data-filter="${filter}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('btn-ghost');
            }

            renderConsultantsAdmin();
        }

        function renderConsultantsAdmin() {
            const container = document.getElementById('consultant-list-admin');
            container.innerHTML = '';

            let consultantsToShow = allConsultantsAdmin;

            if (currentFilter === 'pending') {
                consultantsToShow = allConsultantsAdmin.filter(c => !c.verified);
            } else if (currentFilter === 'verified') {
                consultantsToShow = allConsultantsAdmin.filter(c => c.verified);
            }

            if (consultantsToShow.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 60px;">
                        <i data-lucide="users" style="width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">해당 조건의 컨설턴트가 없습니다.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            consultantsToShow.forEach((consultant, index) => {
                const card = document.createElement('div');
                card.className = 'consultant-approval-card fade-in-up';
                card.style.animationDelay = `${index * 0.05}s`;

                const statusClass = consultant.verified ? 'verified' : 'pending';
                const statusText = consultant.verified ? '검증됨' : '승인 대기';

                // Parse ISO experience
                let isoList = [];
                if (consultant.isoExperience && typeof consultant.isoExperience === 'object') {
                    isoList = Object.keys(consultant.isoExperience);
                }

                // Parse industry experience
                let industryList = consultant.industryExperience || [];

                // Avatar logic
                const avatarContent = consultant.profileImageUrl
                    ? `<img src="${consultant.profileImageUrl}" style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit;">`
                    : (consultant.avatar || consultant.name[0]);

                card.innerHTML = `
                    <div class="consultant-approval-header">
                        <div class="consultant-approval-info">
                            <div class="consultant-approval-avatar">${avatarContent}</div>
                            <div class="consultant-approval-details">
                                <h3>${consultant.name}</h3>
                                <p>${consultant.specialty || '종합'} 전문 · 경력 ${consultant.experience || '-'}</p>
                            </div>
                        </div>
                        <span class="consultant-approval-status ${statusClass}">${statusText}</span>
                    </div>
                    
                    <div class="consultant-approval-body">
                        <div class="approval-info-item">
                            <label>ISO 규격</label>
                            <span>${isoList.length > 0 ? isoList.map(iso => 'ISO ' + iso).join(', ') : '-'}</span>
                        </div>
                        <div class="approval-info-item">
                            <label>산업 경험</label>
                            <span>${industryList.length > 0 ? industryList.join(', ') : '-'}</span>
                        </div>
                        <div class="approval-info-item">
                            <label>신뢰 점수</label>
                            <span style="color: var(--primary);">${consultant.trustScore || 50}점</span>
                        </div>
                        <div class="approval-info-item">
                            <label>리뷰 수</label>
                            <span>${consultant.reviews || 0}개</span>
                        </div>
                    </div>
                    
                    <div class="consultant-approval-actions">
                        <button class="btn btn-secondary btn-sm" onclick="viewConsultantDetails('${consultant.id}')">
                            <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                            상세 보기
                        </button>
                        ${!consultant.verified ? `
                            <button class="btn btn-approve btn-sm" onclick="approveConsultant(${consultant.id})">
                                <i data-lucide="check" style="width: 16px; height: 16px;"></i>
                                승인
                            </button>
                            <button class="btn btn-reject btn-sm" onclick="rejectConsultant(${consultant.id})">
                                <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                                거부
                            </button>
                        ` : `
                            <button class="btn btn-ghost btn-sm" onclick="revokeVerification(${consultant.id})">
                                <i data-lucide="shield-off" style="width: 16px; height: 16px;"></i>
                                검증 취소
                            </button>
                        `}
                    </div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        // Consultant Approval Actions
        async function approveConsultant(id) {
            if (!confirm('이 컨설턴트를 승인하시겠습니까?')) return;

            try {
                const response = await fetch(`/api/admin/consultants/${id}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    showNotification('컨설턴트가 승인되었습니다.', 'success');
                    fetchConsultantsAdmin();
                } else {
                    showNotification('승인 처리 중 오류가 발생했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('서버 연결에 실패했습니다.', 'error');
            }
        }

        async function rejectConsultant(id) {
            const reason = prompt('거부 사유를 입력해주세요:');
            if (!reason) return;

            try {
                const response = await fetch(`/api/admin/consultants/${id}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason })
                });

                if (response.ok) {
                    showNotification('컨설턴트 등록이 거부되었습니다.', 'success');
                    fetchConsultantsAdmin();
                } else {
                    showNotification('처리 중 오류가 발생했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('서버 연결에 실패했습니다.', 'error');
            }
        }

        async function revokeVerification(id) {
            if (!confirm('이 컨설턴트의 검증을 취소하시겠습니까?')) return;

            try {
                const response = await fetch(`/api/admin/consultants/${id}/revoke`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    showNotification('검증이 취소되었습니다.', 'success');
                    fetchConsultantsAdmin();
                } else {
                    showNotification('처리 중 오류가 발생했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('서버 연결에 실패했습니다.', 'error');
            }
        }

        // Delete Job (Matching Request)
        async function deleteJob(jobId, companyName) {
            // Custom confirmation
            const confirmed = confirm(`"${companyName}" 매칭 요청을 삭제하시겠습니까?\n\n삭제된 요청은 복구할 수 없습니다.`);
            if (!confirmed) return;

            try {
                const response = await fetch(`/api/admin/jobs/${jobId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.ok) {
                    showNotification(`"${companyName}" 매칭 요청이 삭제되었습니다.`, 'success');
                    // Remove card from UI with animation
                    const card = document.getElementById(`job-card-${jobId}`);
                    if (card) {
                        card.style.transition = 'opacity 0.3s, transform 0.3s';
                        card.style.opacity = '0';
                        card.style.transform = 'translateX(20px)';
                        setTimeout(() => {
                            card.remove();
                            // Refresh stats
                            fetchJobs();
                        }, 300);
                    } else {
                        fetchJobs();
                    }
                } else {
                    showNotification(data.message || '삭제 중 오류가 발생했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('서버 연결에 실패했습니다.', 'error');
            }
        }

                <div class="info-group" style="margin-top: 32px;">

                    </h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center;">

                            <div class="info-label" style="margin-bottom: 4px;">신뢰 점수</div>
                            <div class="info-value" style="color: var(--primary); font-size: 1.2rem;">${consultant.trustScore || 50}점</div>

                        <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px;">
                            <div class="info-label" style="margin-bottom: 4px;">리뷰 수</div>
                            <div class="info-value" style="font-size: 1.2rem;">${consultant.reviews || 0}개</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px;">
                            <div class="info-label" style="margin-bottom: 4px;">매칭 이력</div>

            document.getElementById('panel-content').innerHTML = contentHtml;

            // Update Footer Buttons
            let footerHtml = `
                <button class="btn btn-secondary" onclick="closeSidePanel()">닫기</button>

                    <i data-lucide="mail" style="width: 18px; height: 18px;"></i>
                    메일 보내기
                </a>
                ${!consultant.verified ? `
                    <button class="btn btn-primary" style="flex: 1;" onclick="approveConsultant(${consultant.id}); closeSidePanel();">
                        <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
                        검증 승인하기
                    </button>
                ` : `
                    <button class="btn btn-sm" style="background: rgba(239, 68, 68, 0.15); color: var(--error);" onclick="revokeVerification(${consultant.id}); closeSidePanel();">

        // Side Panel Controls
        function openSidePanel() {
            document.getElementById('side-panel-overlay').classList.add('active');
            document.getElementById('side-panel').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidePanel() {
            document.getElementById('side-panel-overlay').classList.remove('active');
            document.getElementById('side-panel').classList.remove('active');
            document.body.style.overflow = '';
        }

        // View Job Details - Navigate to dashboard or show side panel
        function viewJobDetails(jobId) {
            const job = allJobsAdmin.find(j => j.id === jobId);
            if (!job) return;

            const intake = job.intake_data || {};
            const date = new Date(job.created_at).toLocaleString('ko-KR');

            // Set Header

            document.getElementById('panel-request-date').textContent = `요청 일시: ${date}`;

            // Build Body Content

                            <label class="info-label">희망 규격</label>

                            <div class="info-value">${intake.industry || '미지정'}</div>
                        </div>
                        <div>
                            <label class="info-label">직원 수</label>
                            <div class="info-value">${intake.employees || '미지정'}</div>
                        </div>
                        <div>
                            <label class="info-label">희망 일정</label>
                            <div class="info-value">${intake.timeline || '유연함'}</div>
                        </div>
                        <div>
                            <label class="info-label">예산</label>
                            <div class="info-value">${intake.budget || '미정'}</div>
                        </div>
                        <div>
                            <label class="info-label">지역</label>
                            <div class="info-value">${intake.region || '전국'}</div>
                        </div>

                    <div class="info-value" style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; font-size: 0.9rem;">
                        ${(intake.issues || []).join('\n') || '특별한 요구사항 없음'}

                </div>

                    <h4 style="margin-bottom: 16px; color: var(--success); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">

        // Notification
        function showNotification(message, type) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const notification = document.createElement('div');
            const bgColor = type === 'success' ? 'rgba(16, 185, 129, 0.9)' : 'rgba(239, 68, 68, 0.9)';

            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 24px;
                padding: 16px 24px;
                background: ${bgColor};
                color: white;
                border-radius: 12px;
                z-index: 10000;
                animation: slideIn 0.3s ease;
                backdrop-filter: blur(10px);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                max-width: 400px;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 4000);
        }

        // Manual Refresh Function
        function refreshData() {
            fetchJobs();
            if (currentTab === 'consultants') {
                fetchConsultantsAdmin();
            }
            showNotification('데이터를 갱신했습니다.', 'success');
        }

        // Initial fetch only
        fetchJobs();
    </script>
