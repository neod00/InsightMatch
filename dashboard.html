<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - InsightMatch</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            padding-top: 120px;
            padding-bottom: 60px;
        }

        /* Quote Request Card */
        .quote-request-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .quote-request-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }

        .quote-request-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .quote-request-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .quote-request-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Stage Indicator */
        .stage-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
        }

        .stage-step {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stage-step.active {
            color: var(--primary);
        }

        .stage-step.completed {
            color: var(--text-secondary);
        }

        .stage-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .stage-step.active .stage-dot {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .stage-step.completed .stage-dot {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .stage-line {
            flex: 1;
            height: 2px;
            background: var(--border);
            max-width: 60px;
        }

        .stage-line.completed {
            background: var(--primary);
        }

        /* Consultant Response Cards */
        .consultant-responses {
            padding: 24px;
        }

        .response-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .response-count {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .response-count strong {
            color: var(--primary);
        }

        .consultant-response-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 12px;
            transition: var(--transition-fast);
        }

        .consultant-response-card:hover {
            border-color: var(--border-hover);
        }

        .consultant-response-card.pending {
            opacity: 0.7;
        }

        .consultant-response-card.selected {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.05);
        }

        .response-card-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .consultant-avatar-large {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .consultant-info-main {
            flex: 1;
        }

        .consultant-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .consultant-name-row h4 {
            font-size: 1.1rem;
            margin: 0;
        }

        .verified-badge-small {
            width: 18px;
            height: 18px;
            color: #3b82f6;
        }

        .consultant-specialty {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .consultant-stats {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .consultant-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .response-status {
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .response-status.pending {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .response-status.submitted {
            background: rgba(16, 185, 129, 0.2);
            color: var(--primary);
        }

        /* Proposal Preview */
        .proposal-preview {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 12px;
        }

        .proposal-preview-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .proposal-preview-row:last-child {
            border-bottom: none;
        }

        .proposal-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .proposal-value {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .proposal-value.highlight {
            color: var(--primary);
        }

        /* Response Actions */
        .response-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* Contract Section */
        .contract-section {
            padding: 20px 24px;
            background: rgba(16, 185, 129, 0.05);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .contract-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Project Progress (계약 후) */
        .project-progress-section {
            padding: 24px;
        }

        .milestone-compact {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .milestone-compact:last-child {
            border-bottom: none;
        }

        .milestone-compact-status {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .milestone-compact-status.completed {
            background: var(--primary);
            border-color: var(--primary);
        }

        .milestone-compact-title {
            flex: 1;
            font-size: 0.95rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stage-indicator {
                flex-wrap: wrap;
                justify-content: center;
            }

            .stage-step span {
                display: none;
            }

            .response-card-header {
                flex-direction: column;
            }

            .contract-section {
                flex-direction: column;
                text-align: center;
            }
        }

        /* Notification Animation */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <i data-lucide="shield-check" style="width: 20px; height: 20px;"></i>
                </div>
                <div class="logo-text">
                    <span>InsightMatch</span>
                    <span>by OpenBrain</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="index.html">홈</a>
                <a href="dashboard.html" class="active" style="color: var(--primary);">대시보드</a>
                <a href="blog.html">블로그</a>
            </div>

            <div class="nav-actions">
                <span id="user-name" style="color: var(--primary); font-weight: 500;"></span>
                <button onclick="logout()" class="btn btn-ghost">
                    <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
                    로그아웃
                </button>
            </div>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobile-nav">
        <a href="index.html">홈</a>
        <a href="dashboard.html" class="active" style="color: var(--primary);">대시보드</a>
        <a href="blog.html">블로그</a>
        <div class="nav-divider"></div>
        <span id="mobile-user-name"
            style="color: var(--primary); font-weight: 500; text-align: center; display: block;"></span>
        <button onclick="logout(); closeMobileMenu();" class="btn btn-ghost" style="width: 100%; max-width: 400px;">
            <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
            로그아웃
        </button>
    </div>

    <!-- Dashboard Container -->
    <div class="container dashboard-container">
        <div class="dashboard-header fade-in-up"
            style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1 style="font-size: 2rem; margin-bottom: 8px;">내 견적 요청</h1>
                <p style="color: var(--text-muted);">전문가에게 요청한 견적 현황을 확인하세요.</p>
            </div>
            <a href="index.html#diagnosis" class="btn btn-primary"
                onclick="localStorage.removeItem('lastAnalysisResult');">
                <i data-lucide="plus" style="width: 18px; height: 18px;"></i>
                새 매칭 시작하기
            </a>
        </div>

        <div id="project-list">
            <div class="card" style="text-align: center; padding: 60px;">
                <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
                <p style="color: var(--text-muted);">견적 요청을 불러오는 중...</p>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden">
            <div class="card" style="text-align: center; padding: 60px;">
                <div
                    style="width: 80px; height: 80px; margin: 0 auto 24px; background: var(--bg-card-hover); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i data-lucide="folder-open" style="width: 40px; height: 40px; color: var(--text-muted);"></i>
                </div>
                <h3 style="margin-bottom: 12px;">진행 중인 견적 요청이 없습니다</h3>
                <p style="color: var(--text-muted); margin-bottom: 24px;">전문가 추천을 받고 견적을 요청해보세요.</p>
                <a href="index.html#diagnosis" class="btn btn-primary">
                    <i data-lucide="plus" style="width: 18px; height: 18px;"></i>
                    전문가 추천받기
                </a>
            </div>
        </div>
    </div>

    <!-- Consultant Profile Modal -->
    <div id="consultant-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content card" style="max-width: 600px; max-height: 80vh; overflow-y: auto;">
            <div class="modal-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 style="margin: 0;">컨설턴트 프로필</h3>
                <button onclick="closeModal()" class="btn btn-ghost" style="padding: 8px;">
                    <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
            <div id="modal-body">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" style="margin-top: 40px;">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; margin-top: 0; padding-top: 0;">
                <span>© 2025 OpenBrain Limited. All rights reserved.</span>
                <span>InsightMatch - AI-Powered ISO Consultant Matching</span>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileNav = document.getElementById('mobile-nav');

        function toggleMobileMenu() {
            mobileMenuBtn.classList.toggle('active');
            mobileNav.classList.toggle('active');
            document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        }

        function closeMobileMenu() {
            mobileMenuBtn.classList.remove('active');
            mobileNav.classList.remove('active');
            document.body.style.overflow = '';
        }

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeMobileMenu();
            }
        });

        // Auth Check
        const user = JSON.parse(localStorage.getItem('user'));
        const token = localStorage.getItem('token');

        if (!user || !token) {
            window.location.href = 'login.html';
        }

        document.getElementById('user-name').textContent = `${user.name}님`;
        document.getElementById('mobile-user-name').textContent = `${user.name}님`;

        // API Base URL
        const API_BASE_URL = (() => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:5000';
            }
            return '';
        })();

        // 프로젝트 상태 설정
        const STATUS_CONFIG = {
            'proposal_pending': { text: '제안서 대기', stage: 1, stageText: '제안서 대기' },
            'reviewing': { text: '검토 중', stage: 2, stageText: '검토 중' },
            'contracted': { text: '계약 완료', stage: 3, stageText: '계약 체결' },
            'in_progress': { text: '진행 중', stage: 3, stageText: '계약 체결' },
            'completed': { text: '완료', stage: 3, stageText: '계약 체결' },
            'planning': { text: '제안서 대기', stage: 1, stageText: '제안서 대기' } // 기존 호환
        };

        async function fetchProjects() {
            try {
                const apiUrl = `${API_BASE_URL}/api/projects?user_id=${user.id}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error('Failed to fetch projects');
                }

                const projects = await response.json();

                if (!Array.isArray(projects) || projects.length === 0) {
                    document.getElementById('project-list').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                // 같은 title로 그룹화 (같은 견적 요청에서 온 프로젝트들)
                const grouped = groupProjectsByTitle(projects);
                renderGroupedProjects(grouped);

            } catch (error) {
                console.error('프로젝트 로딩 에러:', error);
                document.getElementById('project-list').innerHTML = `
                    <div class="card" style="text-align: center; padding: 40px;">
                        <i data-lucide="alert-circle" style="width: 48px; height: 48px; color: var(--error); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-muted);">프로젝트를 불러오지 못했습니다.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function groupProjectsByTitle(projects) {
            const groups = {};
            projects.forEach(p => {
                // session_id를 우선으로 사용, 없으면 title + 생성일자 조합으로 그룹화
                // 이렇게 하면 같은 매칭 세션에서 선택한 컨설턴트들만 그룹으로 묶임
                const key = p.session_id || `${p.title}_${p.start_date?.split('T')[0] || 'unknown'}`;
                if (!groups[key]) {
                    groups[key] = {
                        title: p.title || 'Unknown',
                        session_id: p.session_id,
                        created_at: p.start_date,
                        projects: []
                    };
                }
                groups[key].projects.push(p);
            });
            // 최신순으로 정렬
            return Object.values(groups).sort((a, b) => {
                const dateA = new Date(a.created_at || 0);
                const dateB = new Date(b.created_at || 0);
                return dateB - dateA;
            });
        }

        function renderGroupedProjects(groups) {
            const container = document.getElementById('project-list');
            container.innerHTML = '';

            groups.forEach((group, index) => {
                const card = document.createElement('div');
                card.className = 'quote-request-card fade-in-up';
                card.style.animationDelay = `${index * 0.1}s`;

                // 첫 번째 프로젝트의 상태를 기준으로 전체 상태 결정
                const firstProject = group.projects[0];
                const overallStatus = firstProject.status || 'proposal_pending';
                const statusInfo = STATUS_CONFIG[overallStatus] || STATUS_CONFIG['proposal_pending'];

                // 응답 현황 계산
                const totalConsultants = group.projects.length;
                const respondedConsultants = group.projects.filter(p =>
                    p.proposal_status === 'submitted' || p.status === 'contracted' || p.status === 'in_progress'
                ).length;

                // Stage indicator HTML 생성
                const stageHtml = generateStageIndicator(statusInfo.stage);

                // 컨설턴트 응답 카드 HTML 생성
                const responsesHtml = group.projects.map(p => generateConsultantResponseCard(p)).join('');

                card.innerHTML = `
                    <!-- Header -->
                    <div class="quote-request-header">
                        <div>
                            <div class="quote-request-title">${group.title}</div>
                            <div class="quote-request-meta">
                                <span>
                                    <i data-lucide="calendar" style="width: 14px; height: 14px;"></i>
                                    요청일: ${formatDate(group.created_at)}
                                </span>
                                <span>
                                    <i data-lucide="users" style="width: 14px; height: 14px;"></i>
                                    전문가 ${totalConsultants}명에게 요청
                                </span>
                            </div>
                        </div>
                        <span class="status-badge status-${overallStatus}">${statusInfo.text}</span>
                    </div>
                    
                    <!-- Stage Indicator -->
                    ${stageHtml}
                    
                    <!-- Consultant Responses -->
                    <div class="consultant-responses">
                        <div class="response-header">
                            <h4 style="margin: 0; font-size: 1rem;">전문가 응답 현황</h4>
                            <span class="response-count"><strong>${respondedConsultants}</strong>/${totalConsultants}명 응답</span>
                        </div>
                        ${responsesHtml}
                    </div>
                    
                    ${overallStatus === 'contracted' || overallStatus === 'in_progress' ? `
                    <!-- Contract Section -->
                    <div class="contract-section">
                        <div class="contract-info">
                            <i data-lucide="check-circle" style="width: 18px; height: 18px; color: var(--primary); vertical-align: middle;"></i>
                            계약이 체결되었습니다. 프로젝트가 진행 중입니다.
                        </div>
                    </div>
                    ` : `
                    <!-- Project Actions (제안서 대기 상태에서만) -->
                    <div class="project-actions" style="padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                        <button class="btn btn-secondary btn-sm" onclick="event.preventDefault(); event.stopPropagation(); openAddConsultantModal('${group.title.replace(/'/g, "\\'")}', '${group.session_id || ''}')">
                            <i data-lucide="user-plus" style="width: 14px; height: 14px;"></i>
                            다른 전문가에게도 요청
                        </button>
                        <button class="btn btn-ghost btn-sm delete-all-btn" style="color: var(--error);" data-title="${group.title.replace(/"/g, '&quot;')}" data-session-id="${group.session_id || ''}" onclick="event.preventDefault(); event.stopPropagation(); deleteQuoteRequestGroup(this, event)">
                            <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                            전체 삭제
                        </button>
                    </div>
                    `}
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function generateStageIndicator(currentStage) {
            const stages = [
                { num: 1, text: '제안서 대기' },
                { num: 2, text: '검토 중' },
                { num: 3, text: '계약 체결' }
            ];

            let html = '<div class="stage-indicator">';

            stages.forEach((stage, index) => {
                const isActive = stage.num === currentStage;
                const isCompleted = stage.num < currentStage;
                const stageClass = isActive ? 'active' : (isCompleted ? 'completed' : '');

                html += `
                    <div class="stage-step ${stageClass}">
                        <div class="stage-dot">
                            ${isCompleted ? '<i data-lucide="check" style="width: 14px; height: 14px;"></i>' : stage.num}
                        </div>
                        <span>${stage.text}</span>
                    </div>
                `;

                if (index < stages.length - 1) {
                    const lineClass = isCompleted || isActive ? 'completed' : '';
                    html += `<div class="stage-line ${lineClass}"></div>`;
                }
            });

            html += '</div>';
            return html;
        }

        function generateConsultantResponseCard(project) {
            const isSubmitted = project.proposal_status === 'submitted';
            const isContracted = project.status === 'contracted' || project.status === 'in_progress';
            const isPending = !isSubmitted && !isContracted;

            const cardClass = isContracted ? 'selected' : (isPending ? 'pending' : '');
            const statusClass = isSubmitted ? 'submitted' : 'pending';
            const statusText = isContracted ? '계약 완료' : (isSubmitted ? '제안서 도착' : '응답 대기');

            // 견적 정보 (임시 데이터 - 실제로는 proposal_data에서 가져옴)
            const proposalData = project.proposal_data ? JSON.parse(project.proposal_data) : null;
            const estimatedCost = proposalData?.cost || '협의 필요';
            const estimatedDuration = proposalData?.duration || '협의 필요';

            return `
                <div class="consultant-response-card ${cardClass}">
                    <div class="response-card-header">
                        <div class="consultant-avatar-large">${project.consultant_name?.charAt(0) || '?'}</div>
                        <div class="consultant-info-main">
                            <div class="consultant-name-row">
                                <h4>${project.consultant_name || '컨설턴트'}</h4>
                                <i data-lucide="badge-check" class="verified-badge-small"></i>
                            </div>
                            <div class="consultant-specialty">ISO 인증 전문가</div>
                            <div class="consultant-stats">
                                <span>
                                    <i data-lucide="star" style="width: 14px; height: 14px; color: #f59e0b;"></i>
                                    4.9
                                </span>
                                <span>
                                    <i data-lucide="briefcase" style="width: 14px; height: 14px;"></i>
                                    15년 경력
                                </span>
                            </div>
                        </div>
                        <span class="response-status ${statusClass}">${statusText}</span>
                    </div>
                    
                    ${isSubmitted && !isContracted ? `
                    <div class="proposal-preview">
                        <div class="proposal-preview-row">
                            <span class="proposal-label">예상 비용</span>
                            <span class="proposal-value highlight">${estimatedCost}</span>
                        </div>
                        <div class="proposal-preview-row">
                            <span class="proposal-label">예상 기간</span>
                            <span class="proposal-value">${estimatedDuration}</span>
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="response-actions">
                        <button class="btn btn-secondary btn-sm" onclick="viewConsultantProfile(${project.consultant_id})">
                            <i data-lucide="user" style="width: 14px; height: 14px;"></i>
                            프로필 보기
                        </button>
                        ${isSubmitted && !isContracted ? `
                        <button class="btn btn-secondary btn-sm" onclick="downloadProposal(${project.id})">
                            <i data-lucide="file-text" style="width: 14px; height: 14px;"></i>
                            제안서 보기
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="selectConsultant(${project.id})">
                            <i data-lucide="check" style="width: 14px; height: 14px;"></i>
                            이 전문가 선택
                        </button>
                        ` : ''}
                        ${isPending ? `
                        <button class="btn btn-ghost btn-sm" style="color: var(--text-muted);" onclick="event.preventDefault(); event.stopPropagation(); cancelConsultantRequest(${project.id}, '${project.consultant_name?.replace(/'/g, "\\'")}', event)">
                            <i data-lucide="x" style="width: 14px; height: 14px;"></i>
                            요청 취소
                        </button>
                        ` : ''}
                        ${isContracted ? `
                        <button class="btn btn-primary btn-sm" onclick="viewProjectProgress(${project.id})">
                            <i data-lucide="activity" style="width: 14px; height: 14px;"></i>
                            진행 현황 보기
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        }

        async function viewConsultantProfile(consultantId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/consultants/${consultantId}`);
                if (!response.ok) throw new Error('Failed to fetch consultant');

                const consultant = await response.json();

                document.getElementById('modal-body').innerHTML = `
                    <div style="text-align: center; margin-bottom: 24px;">
                        <div class="consultant-avatar-large" style="width: 80px; height: 80px; font-size: 2rem; margin: 0 auto 16px;">
                            ${consultant.avatar || consultant.name?.charAt(0) || '?'}
                        </div>
                        <h3 style="margin: 0 0 4px;">${consultant.name}</h3>
                        <p style="color: var(--text-muted); margin: 0;">${consultant.specialty || '컨설턴트'}</p>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;">
                        <div style="text-align: center; padding: 16px; background: var(--bg-card); border-radius: var(--radius-md);">
                            <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">${consultant.rating || 5.0}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">평점</div>
                        </div>
                        <div style="text-align: center; padding: 16px; background: var(--bg-card); border-radius: var(--radius-md);">
                            <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">${consultant.experience || '10년'}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">경력</div>
                        </div>
                        <div style="text-align: center; padding: 16px; background: var(--bg-card); border-radius: var(--radius-md);">
                            <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">${consultant.reviews || 0}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">리뷰</div>
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 16px;">
                        <h4 style="font-size: 0.95rem; margin-bottom: 8px;">전문 분야</h4>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">${consultant.matchReason || '다양한 ISO 인증 경험 보유'}</p>
                    </div>
                    
                    ${consultant.isoExperience && Object.keys(consultant.isoExperience).length > 0 ? `
                    <div style="margin-bottom: 16px;">
                        <h4 style="font-size: 0.95rem; margin-bottom: 8px;">ISO 경험</h4>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                            ${Object.entries(consultant.isoExperience).map(([iso, role]) => `
                                <span style="padding: 4px 10px; background: rgba(16, 185, 129, 0.1); color: var(--primary); border-radius: 100px; font-size: 0.8rem;">${iso}</span>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    ${consultant.verified ? `
                    <div style="background: rgba(16, 185, 129, 0.1); padding: 12px 16px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="badge-check" style="width: 20px; height: 20px; color: var(--primary);"></i>
                        <span style="color: var(--primary); font-weight: 500;">인증된 전문가</span>
                    </div>
                    ` : ''}
                `;

                document.getElementById('consultant-modal').classList.remove('hidden');
                lucide.createIcons();

            } catch (error) {
                console.error('컨설턴트 정보 로딩 실패:', error);
                showNotification('컨설턴트 정보를 불러올 수 없습니다.', 'error');
            }
        }

        function closeModal() {
            document.getElementById('consultant-modal').classList.add('hidden');
        }

        async function downloadProposal(projectId) {
            window.location.href = `${API_BASE_URL}/api/projects/${projectId}/proposal`;
        }

        async function selectConsultant(projectId) {
            if (!confirm('이 전문가를 선택하고 계약을 진행하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/projects/${projectId}/sign`, {
                    method: 'POST'
                });

                if (response.ok) {
                    showNotification('계약이 체결되었습니다! 프로젝트가 시작됩니다.', 'success');
                    fetchProjects();
                } else {
                    showNotification('처리에 실패했습니다.', 'error');
                }
            } catch (error) {
                console.error(error);
                showNotification('서버 연결에 실패했습니다.', 'error');
            }
        }

        function viewProjectProgress(projectId) {
            // TODO: 프로젝트 상세 페이지로 이동
            showNotification('프로젝트 상세 페이지는 준비 중입니다.', 'info');
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        function showNotification(message, type) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const notification = document.createElement('div');
            notification.className = 'notification';

            const bgColor = type === 'success' ? 'rgba(16, 185, 129, 0.9)' :
                type === 'error' ? 'rgba(239, 68, 68, 0.9)' :
                    'rgba(59, 130, 246, 0.9)';

            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 24px;
                padding: 16px 24px;
                background: ${bgColor};
                color: white;
                border-radius: 12px;
                display: flex;
                align-items: center;
                gap: 12px;
                z-index: 10000;
                animation: slideIn 0.3s ease;
                backdrop-filter: blur(10px);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            `;
            notification.textContent = message;

            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Modal styles
        const modalStyles = document.createElement('style');
        modalStyles.textContent = `
            .modal {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .modal.hidden {
                display: none;
            }
            .modal-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(4px);
            }
            .modal-content {
                position: relative;
                z-index: 1;
                width: 100%;
            }
        `;
        document.head.appendChild(modalStyles);

        // ===== Custom Confirm Modal =====
        function showConfirmModal(title, message) {
            return new Promise((resolve) => {
                // Remove any existing confirm modal
                const existingModal = document.getElementById('custom-confirm-modal');
                if (existingModal) existingModal.remove();

                const modal = document.createElement('div');
                modal.id = 'custom-confirm-modal';
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.7);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10000;
                `;

                modal.innerHTML = `
                    <div style="
                        background: var(--card-bg, #1a1a2e);
                        border-radius: 16px;
                        padding: 24px;
                        max-width: 400px;
                        width: 90%;
                        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
                        border: 1px solid var(--border, #333);
                    ">
                        <h3 style="margin: 0 0 16px 0; color: var(--text-primary, #fff); font-size: 1.2rem;">
                            ${title}
                        </h3>
                        <p style="margin: 0 0 24px 0; color: var(--text-muted, #aaa); line-height: 1.6;">
                            ${message}
                        </p>
                        <div style="display: flex; gap: 12px; justify-content: flex-end;">
                            <button id="confirm-cancel-btn" class="btn btn-secondary" style="padding: 10px 20px;">
                                취소
                            </button>
                            <button id="confirm-ok-btn" class="btn btn-primary" style="padding: 10px 20px; background: var(--error, #ef4444);">
                                삭제
                            </button>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);

                // Button handlers
                document.getElementById('confirm-cancel-btn').onclick = () => {
                    modal.remove();
                    resolve(false);
                };

                document.getElementById('confirm-ok-btn').onclick = () => {
                    modal.remove();
                    resolve(true);
                };

                // Close on background click
                modal.onclick = (e) => {
                    if (e.target === modal) {
                        modal.remove();
                        resolve(false);
                    }
                };
            });
        }

        // ===== Phase 2: Delete Quote Request Group =====
        window.deleteQuoteRequestGroup = async function (buttonElement, event) {
            // Prevent any event propagation issues
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            console.log('[DEBUG] deleteQuoteRequestGroup called', buttonElement);

            // Get title and session_id from data attributes
            const title = buttonElement.getAttribute('data-title');
            const sessionId = buttonElement.getAttribute('data-session-id');
            console.log('[DEBUG] title:', title, 'sessionId:', sessionId);

            // Use custom confirm modal instead of native confirm
            const confirmResult = await showConfirmModal(
                '요청 삭제 확인',
                `"${title}" 요청을 전체 삭제하시겠습니까?<br><br>모든 컨설턴트에 대한 요청이 삭제됩니다.`
            );
            console.log('[DEBUG] confirm result:', confirmResult);

            if (!confirmResult) {
                return false;
            }

            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                showNotification('로그인이 필요합니다. 로그인 페이지로 이동합니다.', 'error');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            // Show loading state on the button immediately
            const originalButtonContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `
                <span class="loading-spinner" style="width: 14px; height: 14px; border-width: 2px;"></span>
                삭제 중...
            `;

            try {
                // 해당 세션 또는 title을 가진 모든 프로젝트 조회
                const response = await fetch(`${API_BASE_URL}/api/projects?user_id=${user.id}`);
                const projects = await response.json();

                // session_id가 있으면 해당 세션의 프로젝트만, 없으면 title 기반으로 필터링
                const projectsToDelete = projects.filter(p => {
                    const matchesGroup = sessionId
                        ? (p.session_id === sessionId)  // 세션 기반 매칭
                        : (p.title === title);  // 기존 title 기반 매칭 (하위 호환성)
                    return matchesGroup && !['contracted', 'in_progress', 'completed'].includes(p.status);
                });

                if (projectsToDelete.length === 0) {
                    showNotification('삭제할 수 있는 프로젝트가 없습니다.', 'error');
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalButtonContent;
                    lucide.createIcons();
                    return;
                }

                // 모든 프로젝트 삭제
                let successCount = 0;
                for (const project of projectsToDelete) {
                    const deleteResponse = await fetch(`${API_BASE_URL}/api/projects/${project.id}`, {
                        method: 'DELETE'
                    });
                    if (deleteResponse.ok) {
                        successCount++;
                    }
                }

                if (successCount > 0) {
                    showNotification(`${successCount}개의 요청이 삭제되었습니다.`, 'success');
                    fetchProjects(); // 새로고침
                } else {
                    showNotification('삭제에 실패했습니다. 다시 시도해주세요.', 'error');
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalButtonContent;
                    lucide.createIcons();
                }
            } catch (error) {
                console.error('Delete error:', error);
                showNotification('삭제 중 오류가 발생했습니다.', 'error');
                buttonElement.disabled = false;
                buttonElement.innerHTML = originalButtonContent;
                lucide.createIcons();
            }
        }

        // ===== Phase 3: Cancel single consultant request =====
        window.cancelConsultantRequest = async function (projectId, consultantName, event) {
            // Prevent any event propagation issues
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            console.log('[DEBUG] cancelConsultantRequest called', projectId, consultantName);

            // Use custom confirm modal instead of native confirm
            const confirmResult = await showConfirmModal(
                '요청 취소 확인',
                `<strong>${consultantName}</strong>에게 보낸 요청을 취소하시겠습니까?`
            );

            if (!confirmResult) {
                return false;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/projects/${projectId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showNotification(`${consultantName}에 대한 요청이 취소되었습니다.`, 'success');
                    fetchProjects();
                } else {
                    const error = await response.json();
                    showNotification(error.message || '취소에 실패했습니다.', 'error');
                }
            } catch (error) {
                console.error('Cancel error:', error);
                showNotification('취소 중 오류가 발생했습니다.', 'error');
            }
        }

        // ===== Phase 3: Add consultant modal =====
        let currentAddTitle = '';
        let currentAddSessionId = '';

        window.openAddConsultantModal = async function (title, sessionId) {
            console.log('[DEBUG] openAddConsultantModal called', title, sessionId);
            currentAddTitle = title;
            currentAddSessionId = sessionId || '';
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                showNotification('로그인이 필요합니다. 로그인 페이지로 이동합니다.', 'error');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            // 사용 가능한 컨설턴트 조회
            try {
                const response = await fetch(`${API_BASE_URL}/api/projects/${encodeURIComponent(title)}/available-consultants?user_id=${user.id}`);
                const consultants = await response.json();

                if (!Array.isArray(consultants) || consultants.length === 0) {
                    showNotification('추가로 요청할 수 있는 전문가가 없습니다.', 'info');
                    return;
                }

                // 모달 내용 생성
                const consultantCards = consultants.map(c => `
                    <div class="add-consultant-item" style="display: flex; align-items: center; justify-content: space-between; padding: 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div class="consultant-avatar-large" style="width: 48px; height: 48px; font-size: 1.2rem;">${c.name?.charAt(0) || '?'}</div>
                            <div>
                                <div style="font-weight: 600;">${c.name}</div>
                                <div style="font-size: 0.85rem; color: var(--text-muted);">${c.specialty || 'ISO 전문가'}</div>
                                <div style="display: flex; gap: 8px; margin-top: 4px; font-size: 0.8rem; color: var(--text-secondary);">
                                    <span>⭐ ${c.rating || '-'}</span>
                                    <span>경력 ${c.experience || '-'}</span>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="addConsultant(${c.id}, '${c.name?.replace(/'/g, "\\'")}')">
                            <i data-lucide="plus" style="width: 14px; height: 14px;"></i>
                            요청
                        </button>
                    </div>
                `).join('');

                document.getElementById('modal-body').innerHTML = `
                    <h3 style="margin-bottom: 16px;">다른 전문가에게도 요청</h3>
                    <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">
                        "${title}" 프로젝트에 추가로 전문가를 요청합니다.
                    </p>
                    <div style="max-height: 400px; overflow-y: auto;">
                        ${consultantCards}
                    </div>
                `;

                document.getElementById('consultant-modal').classList.remove('hidden');
                lucide.createIcons();
            } catch (error) {
                console.error('Error loading consultants:', error);
                showNotification('전문가 목록을 불러오는데 실패했습니다.', 'error');
            }
        }

        async function addConsultant(consultantId, consultantName) {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/projects/add-consultant`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        consultant_id: consultantId,
                        title: currentAddTitle
                    })
                });

                if (response.ok) {
                    showNotification(`${consultantName}에게 견적 요청을 추가했습니다.`, 'success');
                    closeModal();
                    fetchProjects();
                } else {
                    const error = await response.json();
                    showNotification(error.message || '추가에 실패했습니다.', 'error');
                }
            } catch (error) {
                console.error('Add consultant error:', error);
                showNotification('추가 중 오류가 발생했습니다.', 'error');
            }
        }

        fetchProjects();
    </script>
</body>

</html>
