<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 - InsightMatch</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-main: #0a0f1a;
            --bg-card: rgba(20, 30, 50, 0.8);
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
            display: block;
        }

        .result-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-box .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-box .email {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .links a:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🔍</div>
        <h1>아이디(이메일) 찾기</h1>
        <p class="subtitle">
            가입 시 등록한 이름과 휴대폰 번호를<br>
            입력하시면 이메일을 찾아드립니다.
        </p>

        <div id="message" class="message"></div>

        <form id="find-form">
            <div class="form-group">
                <label for="name">이름 <small style="color: var(--text-muted);">(담당자명 또는 본인 이름)</small></label>
                <input type="text" id="name" placeholder="홍길동" required>
            </div>
            <div class="form-group">
                <label for="phone">휴대폰 번호</label>
                <input type="tel" id="phone" placeholder="010-1234-5678" required>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">
                아이디 찾기
            </button>
        </form>

        <div id="result-box" class="result-box" style="display: none;">
            <div class="label">가입된 이메일</div>
            <div class="email" id="found-email"></div>
        </div>

        <div class="links">
            <a href="forgot-password.html">비밀번호 찾기</a>
            <span style="color: var(--border);">|</span>
            <a href="login.html">로그인</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;

        document.getElementById('find-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const messageEl = document.getElementById('message');
            const resultBox = document.getElementById('result-box');

            if (!name || !phone) {
                messageEl.className = 'message error';
                messageEl.textContent = '이름과 휴대폰 번호를 모두 입력해주세요.';
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span>찾는 중...';
            messageEl.style.display = 'none';
            messageEl.className = 'message';
            resultBox.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/find-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone })
                });

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    data = { message: '서버 오류가 발생했습니다.' };
                }

                messageEl.style.display = 'block';
                if (response.ok) {
                    messageEl.className = 'message success';
                    messageEl.textContent = data.message;
                    document.getElementById('found-email').textContent = data.email;
                    resultBox.style.display = 'block';
                    document.getElementById('find-form').style.display = 'none';
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = data.debug ? `${data.message} (${data.debug})` : (data.message || '아이디를 찾을 수 없습니다.');
                }
            } catch (error) {
                messageEl.style.display = 'block';
                messageEl.className = 'message error';
                messageEl.textContent = '서버 연결에 실패했습니다.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '아이디 찾기';
            }
        });
    </script>
</body>

</html>
