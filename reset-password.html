<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - InsightMatch</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-main: #0a0f1a;
            --bg-card: rgba(20, 30, 50, 0.8);
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
            display: block;
        }

        .password-requirements {
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .password-requirements li {
            margin: 4px 0;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .invalid-token {
            color: var(--error);
        }

        .invalid-token a {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🔑</div>
        <h1>새 비밀번호 설정</h1>
        <p class="subtitle" id="subtitle">새로운 비밀번호를 입력해주세요.</p>

        <div id="message" class="message"></div>

        <form id="reset-form">
            <div class="form-group">
                <label for="password">새 비밀번호</label>
                <input type="password" id="password" placeholder="8자 이상 입력" required minlength="8">
                <ul class="password-requirements">
                    <li>최소 8자 이상</li>
                </ul>
            </div>
            <div class="form-group">
                <label for="confirm-password">비밀번호 확인</label>
                <input type="password" id="confirm-password" placeholder="비밀번호 다시 입력" required>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">
                비밀번호 변경하기
            </button>
        </form>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Check if token exists
        if (!token) {
            document.getElementById('reset-form').style.display = 'none';
            document.getElementById('subtitle').innerHTML = `
                <span class="invalid-token">
                    유효하지 않은 링크입니다.<br><br>
                    <a href="forgot-password.html">비밀번호 찾기 다시 시도</a>
                </span>
            `;
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const submitBtn = document.getElementById('submit-btn');
            const messageEl = document.getElementById('message');

            // Validation
            if (password.length < 8) {
                messageEl.className = 'message error';
                messageEl.textContent = '비밀번호는 8자 이상이어야 합니다.';
                return;
            }

            if (password !== confirmPassword) {
                messageEl.className = 'message error';
                messageEl.textContent = '비밀번호가 일치하지 않습니다.';
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span>변경 중...';
            messageEl.className = 'message';
            messageEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageEl.className = 'message success';
                    messageEl.textContent = data.message;
                    document.getElementById('reset-form').style.display = 'none';

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = data.message || '오류가 발생했습니다.';
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '서버 연결에 실패했습니다.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '비밀번호 변경하기';
            }
        });
    </script>
</body>

</html>
