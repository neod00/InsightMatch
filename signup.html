<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - InsightMatch</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <i data-lucide="shield-check" style="width: 20px; height: 20px;"></i>
                </div>
                <div class="logo-text">
                    <span>InsightMatch</span>
                    <span>by OpenBrain</span>
                </div>
            </a>

            <div class="nav-actions">
                <a href="index.html" class="btn btn-ghost">
                    <i data-lucide="home" style="width: 18px; height: 18px;"></i>
                    홈으로
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobile-nav"
        style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:var(--bg-primary);display:none;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 40px;gap:8px;">
        <button onclick="closeMobileMenu()" style="position:absolute;top:24px;right:24px;background:none;border:none;cursor:pointer;font-size:1.5rem;color:var(--text-primary);">✕</button>
        <a href="index.html" style="width:100%;max-width:400px;padding:14px 20px;font-size:1rem;color:var(--text-primary);text-decoration:none;">홈</a>
        <a href="login.html" style="width:100%;max-width:400px;padding:14px 20px;font-size:1rem;color:var(--text-primary);text-decoration:none;">로그인</a>
        <div class="nav-divider"></div>
        <a href="index.html" class="btn btn-secondary" onclick="closeMobileMenu()">
            <i data-lucide="home" style="width: 18px; height: 18px;"></i>
            홈으로
        </a>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card fade-in-up" style="max-width: 480px;">
            <div class="auth-header">
                <div class="logo-icon" style="width: 56px; height: 56px; margin: 0 auto 16px;">
                    <i data-lucide="user-plus" style="width: 28px; height: 28px;"></i>
                </div>
                <h2>회원가입</h2>
                <p>InsightMatch에 오신 것을 환영합니다.</p>
            </div>

            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label>계정 유형</label>
                    <div class="checkbox-grid" style="grid-template-columns: 1fr 1fr;">
                        <label class="checkbox-card">
                            <input type="radio" name="role" value="company" checked>
                            <span>기업 담당자<small>ISO 인증 상담 필요</small></span>
                        </label>
                        <label class="checkbox-card">
                            <input type="radio" name="role" value="consultant">
                            <span>컨설턴트<small>전문가로 등록</small></span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>이름 <small style="color: var(--text-muted);">(담당자명 또는 본인 이름)</small></label>
                    <input type="text" id="name" required placeholder="홍길동">
                </div>
                <div class="form-group" id="company-name-group">
                    <label>회사명 <small id="company-label-optional"
                            style="color: var(--text-muted); display: none;">(선택)</small></label>
                    <input type="text" id="companyName" required placeholder="(주)인사이트매치">
                </div>
                <div class="form-group" id="industry-group">
                    <label>업종</label>
                    <select id="industry" required style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--text-primary);font-size:0.95rem;">
                        <option value="">선택하세요</option>
                        <option value="전자/반도체">전자/반도체</option>
                        <option value="자동차/부품 제조">자동차/부품 제조</option>
                        <option value="기계/금속 제조">기계/금속 제조</option>
                        <option value="화학/석유화학">화학/석유화학</option>
                        <option value="식품/음료 제조">식품/음료 제조</option>
                        <option value="의약/바이오">의약/바이오</option>
                        <option value="건설/토목">건설/토목</option>
                        <option value="IT/소프트웨어">IT/소프트웨어</option>
                        <option value="물류/운송">물류/운송</option>
                        <option value="서비스업">서비스업</option>
                        <option value="공공기관">공공기관</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
                <div class="form-group" id="employees-group">
                    <label>규모 (종업원 수)</label>
                    <select id="employees" required style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--text-primary);font-size:0.95rem;">
                        <option value="">선택하세요</option>
                        <option value="10명 미만">10명 미만</option>
                        <option value="10~50명">10~50명</option>
                        <option value="50~100명">50~100명</option>
                        <option value="100~300명">100~300명</option>
                        <option value="300명 이상">300명 이상</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>이메일</label>
                    <input type="text" id="email" required placeholder="name@company.com">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" required placeholder="8자 이상 입력해주세요" minlength="8">
                    <div class="password-strength-meter" id="password-strength">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>
                    <small class="strength-text" id="strength-text">8자 이상, 영문+숫자 조합 권장</small>
                </div>
                <div class="form-group">
                    <label>휴대폰 번호 <small style="color: var(--text-muted);">(아이디 찾기에 사용됩니다)</small></label>
                    <input type="tel" id="phone" required placeholder="010-1234-5678">
                </div>
                <div class="form-group">
                    <label>비밀번호 확인</label>
                    <input type="password" id="confirmPassword" required placeholder="비밀번호를 다시 입력해주세요">
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    회원가입
                </button>

                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; text-align: center;">
                    가입 시 <a href="terms.html" target="_blank" rel="noopener"
                        style="color: var(--primary);">이용약관</a> 및
                    <a href="privacy.html" target="_blank" rel="noopener"
                        style="color: var(--primary);">개인정보처리방침</a>에 동의합니다.
                </p>
            </form>

            <div class="auth-footer">
                <p style="color: var(--text-muted);">
                    이미 계정이 있으신가요?
                    <a href="login.html">로그인</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileNav = document.getElementById('mobile-nav');

        function toggleMobileMenu() {
            mobileMenuBtn.classList.toggle('active');
            mobileNav.classList.toggle('active');
            document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        }

        function closeMobileMenu() {
            mobileMenuBtn.classList.remove('active');
            mobileNav.classList.remove('active');
            document.body.style.overflow = '';
        }

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeMobileMenu();
            }
        });

        // === Email Validation (Unicode-aware) ===
        function isValidEmail(email) {
            // RFC 5321 compliant with IDN support (allows Unicode in local part)
            const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return pattern.test(email);
        }

        // === Password Strength Calculation ===
        function calculatePasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score += 1;
            if (password.length >= 12) score += 1;
            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^a-zA-Z0-9]/.test(password)) score += 1;
            return score;
        }

        function updatePasswordStrengthUI(password) {
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            const score = calculatePasswordStrength(password);

            const levels = [
                { min: 0, width: '0%', color: '#ef4444', text: '8자 이상, 영문+숫자 조합 권장' },
                { min: 1, width: '20%', color: '#ef4444', text: '약함' },
                { min: 2, width: '40%', color: '#f97316', text: '보통' },
                { min: 3, width: '60%', color: '#eab308', text: '양호' },
                { min: 4, width: '80%', color: '#22c55e', text: '강함' },
                { min: 5, width: '100%', color: '#16a34a', text: '매우 강함' }
            ];

            const level = levels.filter(l => score >= l.min).pop();
            bar.style.width = level.width;
            bar.style.backgroundColor = level.color;
            text.textContent = level.text;
            text.style.color = level.color;
        }

        // Add password input event listener
        document.getElementById('password').addEventListener('input', (e) => {
            updatePasswordStrengthUI(e.target.value);
        });

        // Add inline CSS for password strength meter
        const style = document.createElement('style');
        style.textContent = `
            .password-strength-meter {
                height: 6px;
                background: rgba(255,255,255,0.1);
                border-radius: 3px;
                margin-top: 8px;
                overflow: hidden;
            }
            .strength-bar {
                height: 100%;
                width: 0%;
                transition: all 0.3s ease;
                border-radius: 3px;
            }
            .strength-text {
                display: block;
                margin-top: 6px;
                font-size: 0.75rem;
                color: var(--text-muted);
                transition: color 0.3s ease;
            }
        `;
        document.head.appendChild(style);

        // Role change listener - toggle company name required/optional
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const companyNameInput = document.getElementById('companyName');
        const companyLabelOptional = document.getElementById('company-label-optional');

        function updateCompanyNameRequired() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const isCompany = role === 'company';
            if (!isCompany) {
                companyNameInput.required = false;
                companyLabelOptional.style.display = 'inline';
            } else {
                companyNameInput.required = true;
                companyLabelOptional.style.display = 'none';
            }
            // 업종/규모 토글 (기업만 표시)
            document.getElementById('industry-group').style.display = isCompany ? '' : 'none';
            document.getElementById('employees-group').style.display = isCompany ? '' : 'none';
            document.getElementById('industry').required = isCompany;
            document.getElementById('employees').required = isCompany;
        }

        roleInputs.forEach(input => {
            input.addEventListener('change', updateCompanyNameRequired);
        });

        // 초대 링크에서 넘어온 경우: 계정 유형을 미리 선택하고 복귀 주소를 유지한다
        const signupParams = new URLSearchParams(window.location.search);
        const presetRole = signupParams.get('role');
        const afterSignupRedirect = signupParams.get('redirect') || '';

        if (presetRole === 'consultant' || presetRole === 'company') {
            const target = document.querySelector(`input[name="role"][value="${presetRole}"]`);
            if (target) target.checked = true;
        }
        if (afterSignupRedirect.includes('consultant_register.html')) {
            const notice = document.createElement('div');
            notice.style.cssText =
                'margin-bottom:20px;padding:12px 16px;border-radius:10px;font-size:0.9rem;' +
                'background:rgba(16,185,129,0.1);border:1px solid #10B981;color:#065f46;';
            notice.innerHTML = '<strong>초대 링크로 오셨습니다.</strong><br>컨설턴트 계정을 만든 뒤 프로필 등록으로 이동합니다.';
            const form = document.getElementById('signup-form');
            form.parentNode.insertBefore(notice, form);
        }

        updateCompanyNameRequired(); // Initialize on load

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const companyName = document.getElementById('companyName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Email Validation
            if (!isValidEmail(email)) {
                showError('유효하지 않은 이메일 형식입니다.');
                return;
            }

            // Password Validation
            if (password !== confirmPassword) {
                showError('비밀번호가 일치하지 않습니다.');
                return;
            }

            if (password.length < 8) {
                showError('비밀번호는 8자 이상이어야 합니다.');
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner" style="width: 20px; height: 20px; border-width: 2px;"></span> 가입 처리 중...';

            try {
                // API Base URL 설정
                const API_BASE_URL = (() => {
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        return 'http://localhost:5000';
                    }
                    return '';
                })();

                const phone = document.getElementById('phone').value;

                const industry = document.getElementById('industry').value;
                const employees = document.getElementById('employees').value;

                const response = await fetch(`${API_BASE_URL}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, company_name: companyName, email, password, role, phone, industry, employees })
                });

                const data = await response.json();

                if (response.ok) {
                    // 컨설턴트인 경우 프로필 등록 안내
                    if (role === 'consultant') {
                        showSuccess('회원가입이 완료되었습니다! 로그인 후 전문가 프로필을 등록해주세요.');
                    } else {
                        showSuccess('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
                    }
                    setTimeout(() => {
                        window.location.href = afterSignupRedirect
                            ? `login.html?redirect=${encodeURIComponent(afterSignupRedirect)}`
                            : 'login.html';
                    }, 2000);
                } else {
                    showError(data.message || '회원가입에 실패했습니다.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '회원가입';
                }
            } catch (error) {
                console.error(error);
                showError('서버 연결에 실패했습니다.');
                submitBtn.disabled = false;
                submitBtn.textContent = '회원가입';
            }
        });

        function showError(message) {
            showMessage(message, 'error');
        }

        function showSuccess(message) {
            showMessage(message, 'success');
        }

        function showMessage(message, type) {
            const existing = document.querySelector('.message-box');
            if (existing) existing.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-box';

            const isError = type === 'error';
            const color = isError ? '#ef4444' : '#22c55e';
            const bgColor = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(34, 197, 94, 0.1)';
            const borderColor = isError ? 'rgba(239, 68, 68, 0.3)' : 'rgba(34, 197, 94, 0.3)';
            const icon = isError ? 'alert-circle' : 'check-circle';

            messageDiv.style.cssText = `
                background: ${bgColor};
                border: 1px solid ${borderColor};
                color: ${color};
                padding: 12px 16px;
                border-radius: 8px;
                margin-bottom: 16px;
                font-size: 0.9rem;
                display: flex;
                align-items: center;
                gap: 8px;
            `;
            messageDiv.innerHTML = `<i data-lucide="${icon}" style="width: 18px; height: 18px;"></i> ${message}`;

            const form = document.getElementById('signup-form');
            form.insertBefore(messageDiv, form.firstChild);
            lucide.createIcons();

            if (isError) {
                setTimeout(() => messageDiv.remove(), 5000);
            }
        }
    </script>
</body>

</html>
